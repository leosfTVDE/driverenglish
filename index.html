<style>
:root{--bg:#F3F6FA;--card:#FFFFFF;--soft:#E9EFF6;--line:#DCE4EE;--pri:#0A6FE0;--pri-soft:#E4F0FD;--on-pri:#FFFFFF;--ok:#0E8F6E;--ok-soft:#E5F5EF;--warm:#B86E00;--warm-soft:#FDF1DC;--err:#B4432F;--err-soft:#FCECE8;--tx:#0B1A2C;--tx2:#5B6B80;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#07111F;--card:#0D1B2D;--soft:#13263B;--line:#1C3149;--pri:#168BFF;--pri-soft:#11294A;--ok:#22D3A6;--ok-soft:#0E2E2A;--warm:#FFB547;--warm-soft:#33260F;--err:#FF8A7A;--err-soft:#3A1D1B;--tx:#F4F8FF;--tx2:#9DB0C7;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#07111F;--card:#0D1B2D;--soft:#13263B;--line:#1C3149;--pri:#168BFF;--pri-soft:#11294A;--ok:#22D3A6;--ok-soft:#0E2E2A;--warm:#FFB547;--warm-soft:#33260F;--err:#FF8A7A;--err-soft:#3A1D1B;--tx:#F4F8FF;--tx2:#9DB0C7;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 18px;max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo{width:32px;height:32px;display:block}
.ttl{flex:1;text-align:center;font-weight:600;font-size:16px}
main{max-width:560px;margin:0 auto;padding:4px 18px calc(96px + env(safe-area-inset-bottom,0px))}
body.focus main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px))}
body.focus nav.tabs{display:none}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--tx2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center}
.tab.on{color:var(--pri)}
h1{font-size:25px;line-height:1.2;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.01em}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.mt{margin-top:12px}.mt2{margin-top:20px}
.lbl{color:var(--tx2);font-size:13px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:8px}
.big2{font-size:21px;font-weight:650;line-height:1.3;margin-top:6px}
.pron{color:var(--tx2);font-size:14px;margin-top:4px}
.pt{font-size:17px;margin-top:10px}
.en{font-size:18px;font-weight:600;line-height:1.35}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--tx2)}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.wide{width:100%}
.btn.on{border-color:var(--err);color:var(--err)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn.ghost{background:transparent;color:var(--tx2)}
.ibtn.sm{width:auto;padding:0 14px;border-radius:22px;font-size:13px;font-weight:600}
.ex .ibtn,.bubble .ibtn{background:var(--card)}
.say{display:inline-flex;gap:8px;margin-top:12px;align-items:center}
.link{background:none;border:0;color:var(--pri);font-weight:600;padding:10px 4px;min-height:44px}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:4px 0 16px}
.prog div{height:100%;background:var(--pri);border-radius:3px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);margin-top:10px;font-size:16px;line-height:1.35}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt:disabled{color:var(--tx);opacity:1}
.fbok,.fbbad{font-weight:700;margin-top:16px;display:flex;align-items:center;gap:6px}
.fbok{color:var(--ok)}.fbbad{color:var(--err)}
.ex{background:var(--soft);border-radius:16px;padding:14px;margin-top:12px}
.playrow{display:flex;justify-content:center;align-items:center;gap:16px;margin:16px 0 8px}
.playbig{width:88px;height:88px;border-radius:50%;background:var(--pri);color:var(--on-pri);border:0;display:flex;align-items:center;justify-content:center}
.slow{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:13px;font-weight:700}
.center{text-align:center}
.bubble{background:var(--soft);border-radius:20px 20px 20px 6px;padding:14px 16px;margin-top:10px}
.who{font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:104px;width:100%}
.tile .ti{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center}
.tile b{font-size:15px}.tile span{font-size:13px;color:var(--tx2);line-height:1.3}
.rcic{width:44px;height:44px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.rowcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--ok);border-radius:4px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.metric b{display:block;font-size:26px;letter-spacing:-.02em}
.home-main{display:flex;gap:16px;align-items:center}
.ringtxt{font-size:20px;font-weight:700}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.mini{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:14px;font-weight:600}
.warm{color:var(--warm)}.okc{color:var(--ok)}
.tok{display:inline-flex;align-items:center;min-height:44px;padding:8px 13px;margin:4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px;font-weight:600}
.ans{min-height:72px;border:1.5px dashed var(--line);border-radius:16px;padding:6px;margin-top:12px;display:flex;flex-wrap:wrap;align-items:center}
.ans .lbl{padding:8px}
.pool{margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--pri);color:transparent}
.err{color:var(--err);font-size:13px;margin-top:8px;min-height:1px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg .btn{min-height:44px;font-size:14px;padding:0 14px}
.seg .btn.sel{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.set{margin-top:18px}
input[type=text]{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:0 14px;font-size:16px;margin-top:8px}
.ach{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ach:first-child{border-top:0}
.ach .ai{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--tx2);flex:none}
.ach.got .ai{background:var(--warm-soft);color:var(--warm)}
.ach.lock{opacity:.6}
.safe{display:flex;gap:10px;align-items:center;background:var(--warm-soft);color:var(--tx);border-radius:14px;padding:12px;margin-top:14px;font-size:14px}
.safe svg{color:var(--warm);flex:none}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(7,17,31,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border-radius:24px;padding:22px;width:100%;max-width:420px}
.sheet .logo{width:56px;height:56px}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:8px auto 10px}
.note{font-size:14px;color:var(--tx2);margin-top:10px}
@media (min-width:700px){.overlay{align-items:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY="driverenglish.v1";
const DEF={v:1,name:"",onboarded:false,settings:{goal:10,theme:"light",accent:"mix",rate:0.9,sound:true},items:{},days:{},session:null,stats:{answers:0,correct:0,listenOk:0,phrasesPracticed:0,sessions:0},sims:{},ach:{}};
const fresh=()=>JSON.parse(JSON.stringify(DEF));
function merge(o){const s=fresh();for(const k in o){if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])&&o[k]&&typeof o[k]==="object")Object.assign(s[k],o[k]);else s[k]=o[k];}return s;}
function load(){try{const r=localStorage.getItem(KEY);if(r)return merge(JSON.parse(r));}catch(e){}return fresh();}
let S=load(),saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){if(!saveWarned){saveWarned=true;toast("Não foi possível salvar o progresso neste navegador");}}}

/* ---------- Revisão espaçada ---------- */
const IV=[0,1,3,7,14,30];
function it(id){return S.items[id]||(S.items[id]={s:0,b:0,d:0,c:0,w:0,lc:-1});}
function introduce(id){const x=it(id);if(!x.s){x.s=1;x.d=tNum();}}
function grade(id,ok){const x=it(id),t=tNum();x.s=1;S.stats.answers++;
 if(ok){S.stats.correct++;x.c++;if(x.lc!==t){x.b=Math.min(5,x.b+1);x.lc=t;}x.d=t+IV[x.b];}
 else{x.w++;x.b=Math.max(0,x.b-2);x.d=t;}}
const seen=id=>!!(S.items[id]&&S.items[id].s);
const isDue=id=>seen(id)&&S.items[id].d<=tNum();
const learned=id=>seen(id)&&S.items[id].b>=1;
const mastered=id=>seen(id)&&S.items[id].b>=3;
const dueList=arr=>arr.filter(o=>isDue(o.id)).sort((a,b)=>S.items[a.id].b-S.items[b.id].b||S.items[b.id].w-S.items[a.id].w);
const unseen=arr=>arr.filter(o=>!seen(o.id));

/* ---------- Áudio ---------- */
const TTS="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
const ACC={uk:{l:"en-gb",n:"Britânico"},us:{l:"en-us",n:"Americano"},au:{l:"en-au",n:"Australiano"},ie:{l:"en-ie",n:"Irlandês"}};
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
let VOICES=[];
const vLang=v=>v.lang.replace("_","-").toLowerCase();
function loadVoices(){if(!TTS)return;VOICES=speechSynthesis.getVoices().filter(v=>/^en-/.test(vLang(v))&&!NOVELTY.test(v.name));}
const availAcc=()=>Object.keys(ACC).filter(k=>VOICES.some(v=>vLang(v).startsWith(ACC[k].l)));
function pickAccent(){const a=availAcc(),s=S.settings.accent;if(!a.length)return null;if(s!=="mix")return a.includes(s)?s:a[0];return a[Math.floor(Math.random()*a.length)];}
function voiceFor(acc){const l=VOICES.filter(v=>vLang(v).startsWith(ACC[acc].l));return l.find(v=>/enhanced|premium|melhorad|aprimorad/i.test(v.name))||l.find(v=>v.localService)||l[0];}
function speak(text,slow,acc){
 if(!TTS){toast("Áudio indisponível neste navegador");return;}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const a=acc||pickAccent();const v=a?voiceFor(a):null;
 if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-US";u.rate=slow?0.6:S.settings.rate;speechSynthesis.speak(u);}catch(e){toast("Não foi possível tocar o áudio");}
}

function beep(ok){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 (ok?[660,880]:[300,240]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(0.12,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.09+.16);o.connect(g).connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.18);});}catch(e){}}
const REC=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);

  mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||"audio/mp4"}));

const STOP=new Set(["the","and","you","your","for","are","our","this","that","there","with","have","was","its","but","can","will","would","could","please","here","what","about","let","may","is","it","to","a","an"]);
const clean=t=>t.toLowerCase().replace(/[.,?!“”]/g,"");

 const toks=p.en.split(" ");

 if(!c.length)c=toks.map((t,i)=>({i,c:clean(t)})).filter(o=>/^[a-z]{2,}$/.test(o.c));

 if(!ALLW)ALLW=[...new Set(PHRASES.flatMap(x=>x.en.split(" ").map(clean)).filter(w=>/^[a-z]{3,}$/.test(w)&&!STOP.has(w)))];
 let pool=ALLW.filter(w=>w!==ch.c&&Math.abs(w.length-ch.c.length)<=3);if(pool.length<2)pool=ALLW.filter(w=>w!==ch.c);

 return {type:"mc",id:p.id,say:p.en,top:`<div class="lbl">Complete a frase</div><div class="big2">${disp}</div><div class="lbl mt">${esc(p.pt)}</div>`,
  opts:shuffle([{t:ch.c,ok:true},...pickN(pool,2).map(w=>({t:w,ok:false}))]),sayAfter:p.en,
  after:`<div class="ex"><div class="en">${esc(p.en)}</div>${sayBtns(p.en)}</div>`};

/* ---------- Sessão diária ---------- */
function buildSession(short){
 const st=[];
 dueList(WORDS).slice(0,short?3:5).forEach(w=>st.push({k:"mcw",id:w.id,dir:Math.random()<.5?"en":"pt"}));
 if(!short){const nw=unseen(WORDS).slice(0,4);nw.forEach(w=>st.push({k:"learn",id:w.id}));nw.forEach(w=>st.push({k:"mcw",id:w.id,dir:"en"}));}
 const ls=[...new Set([...dueList(LISTEN),...unseen(LISTEN)])];
 (ls.length?ls:pickN(LISTEN,3)).slice(0,short?2:3).forEach(l=>st.push({k:"listen",id:l.id}));
 const ps=[...new Set([...dueList(PHRASES),...unseen(PHRASES)])];
 const pp=(ps.length?ps:pickN(PHRASES,2)).slice(0,short?1:2);
 pp.forEach(p=>st.push({k:"phrase",id:p.id}));
 if(!short){pp.forEach(p=>st.push({k:p.en.split(" ").length<=9?"build":"fill",id:p.id}));
  let si=SIMS.findIndex((_,i)=>!S.sims[i]);if(si<0)si=Math.floor(Math.random()*SIMS.length);
  SIMS[si].turns.forEach((_,ti)=>st.push({k:"sim",si,ti}));}
 return {date:todayStr(),short,steps:st,i:0,n:0,ok:0,done:false};
}
function stepQ(st){
 switch(st.k){case"mcw":return makeMCWord(byId[st.id],st.dir);case"learn":return makeLearn(byId[st.id]);case"listen":return makeListen(byId[st.id]);
 case"phrase":return makePhrase(byId[st.id]);case"build":return makeBuild(byId[st.id]);case"fill":return makeFill(byId[st.id]);case"sim":return makeSim(st.si,st.ti);}
}
function startSession(short){
 const ses=S.session&&S.session.date===todayStr()?S.session:null;
 if(!(ses&&!ses.done&&!short))S.session=buildSession(!!short);
 save();go("session");autoSpeak();
}

/* ---------- Jogos ---------- */
function practiceWord(ex){
 const d=dueList(WORDS).filter(w=>!ex.has(w.id));if(d.length)return d[0];
 const sn=WORDS.filter(w=>seen(w.id)&&!ex.has(w.id));if(sn.length>=6)return pickN(sn,1)[0];
 return unseen(WORDS).filter(w=>!ex.has(w.id))[0]||pickN(WORDS.filter(w=>!ex.has(w.id)),1)[0];
}
function practicePhrase(ex,shortOnly){
 const pool=PHRASES.filter(p=>!ex.has(p.id)&&(!shortOnly||p.en.split(" ").length<=9));
 const d=dueList(pool);if(d.length)return d[0];
 const sn=pool.filter(p=>seen(p.id));if(sn.length>=5)return pickN(sn,1)[0];
 return pickN(pool,1)[0];
}
function gameQ(){
 const g=G;
 if(g.type==="sim")return makeSim(g.si,g.n);
 if(g.type==="flash"){const w=practiceWord(g.used);g.used.add(w.id);introduce(w.id);return {type:"flash",id:w.id,say:w.en,auto:true,rev:false};}
 if(g.type==="quiz"){const w=practiceWord(g.used);g.used.add(w.id);introduce(w.id);return makeMCWord(w,Math.random()<.5?"en":"pt");}
 const p=practicePhrase(g.used,g.type==="build");g.used.add(p.id);
 return g.type==="fill"?makeFill(p):makeBuild(p);
}

  if(!ss.done){ss.done=true;S.stats.sessions++;const d=todayStr();S.days[d]=Math.max(S.days[d]||0,60);save();checkAch();}
  return `<div class="card center mt2"><div class="done-ic">${ic("check",36)}</div><h1>Sessão concluída</h1><p class="lbl" style="font-size:15px">${ss.n?`Você acertou ${ss.ok} de ${ss.n}.`:""} Amanhã o app traz de volta o que precisa de revisão.</p></div>
  <button class="btn pri wide mt2" data-act="tab" data-tab="home">Voltar ao início</button><button class="btn wide mt" data-act="tab" data-tab="listen">Treinar o ouvido mais um pouco</button>`;}
 const key="S"+ss.date+":"+ss.i+":"+ss.steps.length;
 if(Q&&Q.key===key&&Q.done){ss.i++;save();return V.session();}
 if(!Q||Q.key!==key){Q=stepQ(ss.steps[ss.i]);Q.key=key;}
 return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${ss.steps.length}" aria-valuenow="${ss.i}"><div style="width:${Math.round(ss.i/ss.steps.length*100)}%"></div></div>${renderQ(Q)}`;
};
V.game=()=>{
 if(!G)return V.practice();
 if(G.n>=G.total){const r=G.ok/G.total;
  return `<div class="card center mt2"><div class="done-ic">${ic(G.type==="sim"?"chat":"star",34)}</div><h1>${G.ok} de ${G.total}</h1><p class="lbl" style="font-size:15px">${r>=.8?"Excelente! Continue assim.":r>=.5?"Bom trabalho. As que você errou voltam na revisão.":"Tudo bem errar: é assim que se aprende. Elas voltam na revisão."}</p></div>
  <button class="btn pri wide mt2" data-act="again">${G.type==="sim"?"Repetir simulação":"Jogar de novo"}</button><button class="btn wide mt" data-act="back">Voltar</button>`;}
 const key="G"+gk+":"+G.n;
 if(Q&&Q.key===key&&Q.done){G.n++;return V.game();}
 if(!Q||Q.key!==key){Q=gameQ();Q.key=key;}
 return `<div class="prog"><div style="width:${Math.round(G.n/G.total*100)}%"></div></div>${renderQ(Q)}`;
};
function nextListen(){
 const d=dueList(LISTEN);if(d.length&&(!Q||d[0].id!==Q.id))return d[0];
 const u=unseen(LISTEN);if(u.length)return u[0];
 return pickN(LISTEN.filter(l=>!Q||l.id!==Q.id),1)[0];
}
V.listen=()=>{
 if(Q&&Q.key==="L"+Lc&&Q.done)Lc++;
 const key="L"+Lc;
 if(!Q||Q.key!==key){Q=makeListen(nextListen());Q.key=key;}
 const heard=LISTEN.filter(l=>seen(l.id)).length;
 return `<p class="lbl">Frases que os clientes dizem. Ouça e escolha o significado.</p><div class="row" style="justify-content:space-between;margin:8px 0 12px"><span class="chip">${heard} de ${LISTEN.length} ouvidas</span><button class="link" data-act="go" data-s="settings">Mudar sotaque</button></div>${renderQ(Q)}`;
};
V.practice=()=>{
 const tile=(g,i,t,d)=>`<button class="tile" data-act="game" data-g="${g}"><span class="ti">${ic(i,22)}</span><b>${t}</b><span>${d}</span></button>`;
 const simDone=SIMS.filter((_,i)=>S.sims[i]).length;
 return `<h2 style="margin-top:6px">Jogos</h2><div class="grid2">${tile("flash","cards","Flashcards","Veja a palavra e lembre o significado")}${tile("quiz","quiz","Quiz","Escolha a tradução certa")}${tile("fill","fill","Completar","Escolha a palavra que falta")}${tile("build","blocks","Montar frases","Monte a frase em inglês")}</div>
 <h2>Conversa</h2><button class="rowcard" data-act="go" data-s="sims"><span class="rcic">${ic("chat",22)}</span><span style="flex:1"><b>Simulação real</b><br><span class="lbl">Responda ao passageiro em ${SIMS.length} situações. ${simDone} ${simDone===1?"concluída":"concluídas"}.</span></span></button>
 <h2>Biblioteca</h2><div class="grid2"><button class="tile" data-act="go" data-s="library"><span class="ti">${ic("book",22)}</span><b>Vocabulário</b><span>${WORDS.length} palavras do trabalho</span></button><button class="tile" data-act="go" data-s="phrases"><span class="ti">${ic("quote",22)}</span><b>Frases</b><span>${PHRASES.length} frases profissionais</span></button></div>`;
};
V.sims=()=>`<p class="lbl">O passageiro fala e você escolhe a melhor resposta. Depois, ouça e repita.</p>`+SIMS.map((s,i)=>`<button class="rowcard" data-act="game" data-g="sim" data-si="${i}"><span style="flex:1"><b>${esc(s.t)}</b><br><span class="lbl">${s.turns.length} falas</span></span>${S.sims[i]?`<span class="okc">${ic("check",22)}</span>`:""}</button>`).join("");
V.library=()=>`<p class="lbl">Palavras organizadas por tema. Toque num tema para ver, ouvir e marcar as que já sabe.</p>`+CATS.map((c,ci)=>{const ws=WORDS.filter(w=>w.cat===ci),l=ws.filter(w=>learned(w.id)).length;return `<button class="rowcard" data-act="go" data-s="category" data-c="${ci}"><span style="flex:1"><b>${esc(c.n)}</b><div class="bar"><div style="width:${l/ws.length*100}%"></div></div><span class="lbl">${l} de ${ws.length} aprendidas</span></span></button>`;}).join("");
V.category=()=>WORDS.filter(w=>w.cat===cur.c).map(w=>`<div class="card mt"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="en" style="font-size:20px">${esc(w.en)}</div><div class="pron">${esc(w.pr)}</div><div class="pt" style="margin-top:4px">${esc(w.pt)}</div></div>${TTS?`<button class="ibtn" data-act="say" data-t="${esc(w.en)}" aria-label="Ouvir ${esc(w.en)}">${ic("vol",20)}</button>`:""}</div><div class="ex"><div>${esc(w.ex)}</div><div class="lbl">${esc(w.expt)}</div>${sayBtns(w.ex)}</div><button class="btn wide mt${learned(w.id)?" sel":""}" data-act="known" data-id="${w.id}" style="${learned(w.id)?"color:var(--ok);border-color:var(--ok)":""}">${learned(w.id)?ic("check",18)+" Aprendida":"Marcar como aprendida"}</button></div>`).join("");
V.phrases=()=>Object.keys(CTX).map(k=>`<h2>${CTX[k]}</h2>`+PHRASES.filter(p=>p.ctx===k).map(p=>`<div class="card mt"><div class="en">${esc(p.en)}</div><div class="lbl" style="font-size:15px;margin-top:4px">${esc(p.pt)}</div>${p.note?`<div class="note">Dica: ${esc(p.note)}</div>`:""}${sayBtns(p.en)}</div>`).join("")).join("");
V.progress=()=>{
 const acc=S.stats.answers?Math.round(S.stats.correct/S.stats.answers*100):0;
 const mins=Math.round(Object.values(S.days).reduce((a,b)=>a+b,0)/60);
 const ph=PHRASES.filter(p=>seen(p.id)).length,ms=WORDS.filter(w=>mastered(w.id)).length;
 const rev=WORDS.filter(w=>seen(w.id)&&(S.items[w.id].w>0&&S.items[w.id].b<3||S.items[w.id].d<=tNum())).sort((a,b)=>S.items[b.id].w-S.items[a.id].w).slice(0,12);
 const m=(v,l)=>`<div class="metric"><b>${v}</b><span class="lbl">${l}</span></div>`;
 return `<div class="metrics" style="margin-top:6px">${m(learnedCount()+"/"+WORDS.length,"palavras aprendidas")}${m(ms,"palavras dominadas")}${m(ph+"/"+PHRASES.length,"frases praticadas")}${m(S.stats.answers?acc+"%":"–","de acertos")}${m(mins,"minutos de estudo")}${m(practicedDays(),"dias de prática")}</div>
 <p class="note">Uma palavra fica “dominada” depois de acertos em dias diferentes.</p>
 <h2>Por tema</h2><div class="card">${CATS.map((c,ci)=>{const ws=WORDS.filter(w=>w.cat===ci),l=ws.filter(w=>learned(w.id)).length,d=ws.filter(w=>mastered(w.id)).length;return `<div style="margin:8px 0 14px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${esc(c.n)}</b><span class="lbl">${l}/10${d?`, ${d} dominadas`:""}</span></div><div class="bar"><div style="width:${l*10}%"></div></div></div>`;}).join("")}</div>
 <h2>Precisam de revisão</h2>${rev.length?`<div class="card">${rev.map(w=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span><b>${esc(w.en)}</b> <span class="lbl">${esc(w.pt)}</span></span>${TTS?`<button class="ibtn" data-act="say" data-t="${esc(w.en)}" aria-label="Ouvir ${esc(w.en)}">${ic("vol",18)}</button>`:""}</div>`).join("")}</div><button class="btn pri wide mt" data-act="game" data-g="quiz">Revisar agora</button>`:`<p class="note">Nada pendente. As palavras que você errar aparecem aqui.</p>`}
 <h2>Conquistas</h2><div class="card">${ACH.map(a=>`<div class="ach ${S.ach[a.k]?"got":"lock"}"><span class="ai">${ic("star",20)}</span><span><b style="font-size:15px">${a.t}</b><br><span class="lbl">${a.d}</span></span></div>`).join("")}</div>
 <h2>Cópia de segurança</h2><p class="note" style="margin-top:0">O progresso fica guardado neste aparelho. Salve uma cópia de vez em quando para não perder nada.</p><div class="grid2 mt"><button class="btn" data-act="export">${ic("down",18)} Salvar cópia</button><button class="btn" data-act="import">${ic("up",18)} Restaurar</button></div>`;
};
V.settings=()=>{
 const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="btn${String(S.settings[k])===String(v)?" sel":""}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div>`;
 const av=availAcc();
 const accOpts=[["mix","Variado"],...Object.keys(ACC).filter(k=>av.includes(k)).map(k=>[k,ACC[k].n])];
 return `<div class="set"><label class="lbl" for="nm2">Seu nome</label><input id="nm2" type="text" value="${esc(S.name)}" maxlength="30" autocomplete="given-name" placeholder="Seu nome"></div>
 <div class="set"><div class="lbl">Meta diária</div>${seg("goal",[[5,"5 min"],[10,"10 min"],[15,"15 min"]])}</div>
 <div class="set"><div class="lbl">Tema</div>${seg("theme",[["light","Claro"],["auto","Automático"],["dark","Escuro"]])}</div>
 <div class="set"><div class="lbl">Sotaque das vozes</div>${TTS?(av.length?seg("accent",accOpts):`<p class="note">Nenhuma voz em inglês encontrada ainda.</p>`):`<p class="note">Este navegador não tem voz sintetizada.</p>`}</div>
 <div class="set"><div class="lbl">Velocidade normal da voz</div>${seg("rate",[[0.8,"Devagar"],[0.9,"Normal"],[1,"Rápida"]])}</div>
 <div class="set"><div class="lbl">Sons de acerto e erro</div>${seg("sound",[["true","Ligados"],["false","Desligados"]])}</div>
 ${TTS?`<button class="btn wide mt2" data-act="testVoice">${ic("vol",18)} Testar voz</button>`:""}
 <p class="note">Para vozes mais naturais e mais sotaques no iPhone: abra Ajustes e pesquise “Vozes”. Ou vá em Ajustes › Acessibilidade › Ler e Falar › Vozes › Inglês (em versões antigas do iOS: Conteúdo Falado). Baixe vozes “Melhorada” ou “Premium” e depois feche e reabra o app.</p>
 <div class="safe">${ic("car",22)}<span>Use o app só com o carro parado.</span></div>
 <h2>Lembrete diário</h2><p class="note" style="margin-top:0">Crie um lembrete no app Lembretes do iPhone, por exemplo “Praticar inglês, 10 min”, no horário em que costuma esperar clientes.</p>
 <button class="btn wide mt2" data-act="reset" style="color:var(--err)">Apagar todo o progresso</button><p class="note center">DriverEnglish 1.0.1</p>`;
};

/* ---------- Ações ---------- */
function toggleKnown(id){const x=it(id);if(learned(id)){x.b=0;x.d=tNum();}else{x.s=1;x.b=Math.max(x.b,1);x.d=tNum()+1;}save();checkAch();const y=window.scrollY;render();window.scrollTo(0,y);}
function setSetting(k,v){
 if(k==="goal")v=+v;else if(k==="rate")v=+v;else if(k==="sound")v=v==="true";
 S.settings[k]=v;save();if(k==="theme")applyTheme();const y=window.scrollY;render();window.scrollTo(0,y);
 if(k==="accent"||k==="rate")speak("Hello, welcome to Lisbon.",false,v==="mix"?null:(k==="accent"?v:null));
}
function applyTheme(){
 const t=S.settings.theme;document.documentElement.dataset.theme=t;
 const dark=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#07111F":"#F3F6FA";
}
async function exportData(){
 const name="driverenglish-progresso-"+todayStr()+".json",blob=new Blob([JSON.stringify(S)],{type:"application/json"});
 try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Progresso DriverEnglish"});return;}}
 catch(e){if(e&&e.name==="AbortError")return;}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Cópia salva");
}
const A={
 tab:d=>{go(d.tab);if(d.tab==="listen")autoSpeak();},
 go:d=>go(d.s,d.c!==undefined?{c:+d.c}:{}),
 back:()=>back(),
 say:d=>speak(d.t,!!d.slow),
 sayQ:d=>{if(Q&&Q.say)speak(Q.say,!!d.slow,Q.acc);},
 start:()=>startSession(false),
 startShort:()=>startSession(true),
 answer:d=>answer(+d.i),
 next:()=>{
  if(cur.s==="session"){S.session.i++;save();}
  else if(cur.s==="game")G.n++;
  else if(cur.s==="listen")Lc++;
  render();window.scrollTo(0,0);autoSpeak();
 },
 reveal:()=>{Q.rev=true;render();},
 flashGrade:d=>{const ok=d.ok==="1";grade(Q.id,ok);if(ok)G.ok++;save();checkAch();G.n++;render();window.scrollTo(0,0);autoSpeak();},
 pick:d=>{if(Q.done)return;Q.picked.push(+d.k);$("#barea").innerHTML=buildHTML(Q);},
 unpick:d=>{if(Q.done)return;Q.picked.splice(+d.j,1);$("#barea").innerHTML=buildHTML(Q);},
 check:()=>checkBuild(),
 phraseDone:()=>{S.stats.phrasesPracticed++;const x=it(Q.id);x.pr=(x.pr||0)+1;save();A.next();},
 rec:(d,el)=>recToggle(el),
 playRec:()=>{if(recUrl)new Audio(recUrl).play().catch(()=>toast("Não foi possível tocar a gravação"));},
 game:d=>startGame(d.g,d.si),
 again:()=>startGame(G.type,G.si),
 known:d=>toggleKnown(d.id),
 set:d=>setSetting(d.k,d.v),
 testVoice:()=>speak("Good morning. Welcome to Lisbon. I’m your driver today."),
 export:()=>exportData(),
 import:()=>$("#imp").click(),
 reset:()=>{if(confirm("Apagar todo o progresso? Isto não pode ser desfeito.")){const n=S.name,st=S.settings;S=fresh();S.name=n;S.settings=st;S.onboarded=true;Q=null;save();go("home");toast("Progresso apagado");}},
 showPt:()=>{const x=$("#ppt");if(x)x.hidden=!x.hidden;},
 onboard:()=>{S.name=($("#nm").value||"").trim().slice(0,30);S.onboarded=true;save();$("#modal").innerHTML="";render();}
};
document.addEventListener("click",e=>{lastAct=Date.now();const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el.dataset,el,e);});
document.addEventListener("change",e=>{if(e.target.id==="nm2"){S.name=e.target.value.trim().slice(0,30);save();toast("Nome salvo");}});
document.addEventListener("touchstart",()=>{lastAct=Date.now();},{passive:true});
$("#imp").addEventListener("change",async e=>{
 const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
 try{const o=JSON.parse(await f.text());if(!o||typeof o!=="object"||!o.items||!o.settings)throw new Error("inválido");
  if(!confirm("Substituir o progresso atual por esta cópia?"))return;S=merge(o);Q=null;save();applyTheme();go("home");toast("Progresso restaurado");}
 catch(err){toast("Este arquivo não é uma cópia válida do DriverEnglish");}
});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---------- Tempo de estudo ---------- */
const ACTIVE=new Set(["session","game","listen","category","phrases"]);let tick=0;
setInterval(()=>{if(document.visibilityState==="visible"&&ACTIVE.has(cur.s)&&Date.now()-lastAct<120000){const d=todayStr();S.days[d]=(S.days[d]||0)+1;if(++tick%10===0)save();}},1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){save();if(TTS)speechSynthesis.cancel();}});

/* ---------- Início ---------- */
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(cur.s==="settings"){const y=window.scrollY;render();window.scrollTo(0,y);}};}
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
applyTheme();render();
if(!S.onboarded){$("#modal").innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="obt">${LOGO}<h2 id="obt" style="margin-top:14px">Bem-vindo ao DriverEnglish</h2><p class="lbl" style="font-size:15px">Inglês para o dia a dia com passageiros, em 10 minutos por dia. Sem conta e sem pressão.</p><label class="lbl" for="nm" style="display:block;margin-top:16px">Como você quer ser chamado?</label><input id="nm" type="text" maxlength="30" autocomplete="given-name" placeholder="Seu nome"><div class="safe">${ic("car",22)}<span>Pratique sempre com o carro parado.</span></div><button class="btn pri wide mt" data-act="onboard">Começar</button></div></div>`;}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
