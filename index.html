<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriverEnglish</title>
<meta name="description" content="Inglês prático para motoristas de transfer e turismo: escuta ativa, fala em voz alta e diálogos reais.">
<meta name="theme-color" content="#F4F6F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DriverEnglish">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F4F6F9;
  --surface:#FFFFFF;
  --surface-2:#EEF2F7;
  --line:#E2E8F0;
  --line-strong:#CBD5E1;
  --ink:#0F172A;
  --ink-2:#475569;
  --ink-3:#64748B;
  --pri:#0F5EF7;
  --pri-hover:#0B4AD0;
  --pri-soft:#EBF2FF;
  --on-pri:#FFFFFF;
  --ok:#0D8A6A;
  --ok-soft:#E6F6F1;
  --warn:#B45309;
  --warn-soft:#FEF3C7;
  --err:#C23B2B;
  --err-soft:#FDECE9;
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 8px 24px rgba(15,23,42,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#090E17;
  --surface:#111927;
  --surface-2:#182336;
  --line:#233148;
  --line-strong:#334666;
  --ink:#F8FAFC;
  --ink-2:#CBD5E1;
  --ink-3:#94A3B8;
  --pri:#3B82F6;
  --pri-hover:#60A5FA;
  --pri-soft:rgba(59,130,246,.14);
  --on-pri:#FFFFFF;
  --ok:#2DD4BF;
  --ok-soft:rgba(45,212,191,.12);
  --warn:#FBBF24;
  --warn-soft:rgba(251,191,36,.13);
  --err:#F87171;
  --err-soft:rgba(248,113,113,.14);
  --shadow-sm:none;
  --shadow-md:0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#090E17;
    --surface:#111927;
    --surface-2:#182336;
    --line:#233148;
    --line-strong:#334666;
    --ink:#F8FAFC;
    --ink-2:#CBD5E1;
    --ink-3:#94A3B8;
    --pri:#3B82F6;
    --pri-hover:#60A5FA;
    --pri-soft:rgba(59,130,246,.14);
    --on-pri:#FFFFFF;
    --ok:#2DD4BF;
    --ok-soft:rgba(45,212,191,.12);
    --warn:#FBBF24;
    --warn-soft:rgba(251,191,36,.13);
    --err:#F87171;
    --err-soft:rgba(248,113,113,.14);
    --shadow-sm:none;
    --shadow-md:0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2.5px solid var(--pri);
  outline-offset:2px;
}

/* Header & Layout */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  padding-top:env(safe-area-inset-top,0px);
}
.top-in{
  max-width:600px;
  margin:0 auto;
  height:56px;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:10px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  font-weight:700;
  font-size:17px;
  letter-spacing:-.02em;
}
.logo{width:30px;height:30px;display:block;flex:none}
.ttl{
  flex:1;
  text-align:center;
  font-weight:650;
  font-size:16px;
  letter-spacing:-.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
main{
  max-width:600px;
  margin:0 auto;
  padding:14px 18px calc(104px + env(safe-area-inset-bottom,0px));
}
body.focus main{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}

/* Bottom Navigation */
nav.tabs{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:20;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.focus nav.tabs{display:none}
nav.tabs .in{
  max-width:600px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}
.tab{
  background:none;
  border:0;
  color:var(--ink-3);
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
  min-height:56px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  transition:color .15s ease;
}
.tab.on{color:var(--pri)}

/* Typography & Surfaces */
h1{
  font-size:26px;
  line-height:1.18;
  margin:4px 0 4px;
  letter-spacing:-.025em;
  font-weight:750;
}
h2{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-3);
  font-weight:700;
  margin:26px 0 10px;
}
p{margin:0}
.muted{color:var(--ink-2);font-size:14px}
.sm{font-size:13px}
.mt{margin-top:12px}
.mt2{margin-top:20px}
.center{text-align:center}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-sm);
}
.card-soft{
  background:var(--surface-2);
  border:1px solid transparent;
  border-radius:var(--radius-lg);
  padding:16px;
}
.en{
  font-size:18px;
  font-weight:650;
  line-height:1.35;
  letter-spacing:-.01em;
}
.en-lg{
  font-size:22px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.02em;
}
.pt{
  font-size:15px;
  color:var(--ink-2);
  margin-top:6px;
}
.pron{
  color:var(--ink-3);
  font-size:13.5px;
  margin-top:4px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  background:var(--surface-2);
  color:var(--ink-2);
}
.chip.pri{background:var(--pri-soft);color:var(--pri)}
.chip.exec{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}

/* Buttons & Inputs */
.btn{
  min-height:46px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  font-weight:600;
  font-size:15px;
  padding:0 15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .15s ease,border-color .15s ease,transform .08s ease;
}
.btn:active{transform:scale(.99)}
.btn.pri{
  background:var(--pri);
  border-color:var(--pri);
  color:var(--on-pri);
}
.btn.pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.soft{
  background:var(--pri-soft);
  border-color:transparent;
  color:var(--pri);
}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:var(--radius-sm)}
.btn.sel{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.btn.rec{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.ibtn{
  width:42px;height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.ibtn.pri{border-color:transparent;background:var(--pri-soft);color:var(--pri)}
.ibtn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.ibtn.sm{width:auto;height:36px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:650}
.ibtn:disabled{opacity:.35;cursor:not-allowed}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.link{
  background:none;border:0;
  color:var(--pri);
  font-weight:600;
  font-size:14px;
  padding:6px 4px;
  display:inline-flex;
  align-items:center;
  gap:4px;
}

.search-trigger{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:48px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-3);
  padding:0 14px;
  font-size:15px;
  text-align:left;
  box-shadow:var(--shadow-sm);
}
.sfield{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface);
  border:1.5px solid var(--pri);
  border-radius:var(--radius-md);
  padding:0 12px;
}
.sfield input{
  flex:1;
  border:0;background:transparent;
  min-height:46px;outline:none;font-size:16px;
}
input[type=text],textarea{
  width:100%;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  padding:12px 14px;
  font-size:15.5px;
}
input[type=text]{min-height:46px;padding:0 14px}
textarea{min-height:84px;resize:vertical}

/* Progress & Exercise Blocks */
.prog{
  height:5px;
  background:var(--surface-2);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:16px;
}
.prog>div{
  height:100%;
  background:var(--pri);
  border-radius:999px;
  transition:width .25s ease;
}
.bar{
  height:6px;
  background:var(--surface-2);
  border-radius:999px;
  overflow:hidden;
  margin-top:8px;
}
.bar>div{height:100%;background:var(--ok);border-radius:999px}

.bubble{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px 20px 20px 6px;
  padding:16px;
}
.who{
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-3);
  margin-bottom:4px;
}
.callout{
  background:var(--surface-2);
  border-radius:var(--radius-md);
  padding:12px 14px;
  margin-top:12px;
  font-size:14px;
}
.callout.warn{background:var(--warn-soft);color:var(--ink)}
.callout.warn b{color:var(--warn)}
.callout.pri{background:var(--pri-soft);color:var(--ink)}
.callout.pri b{color:var(--pri)}
.callout.err{background:var(--err-soft);color:var(--ink)}
.callout.err b{color:var(--err)}

.opt{
  display:block;
  width:100%;
  text-align:left;
  min-height:54px;
  padding:13px 16px;
  border-radius:var(--radius-md);
  border:1.5px solid var(--line);
  background:var(--surface);
  margin-top:10px;
  font-size:15.5px;
  line-height:1.35;
  transition:border-color .15s ease,background .15s ease;
}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}

.fb-ok,.fb-bad{
  font-weight:700;
  font-size:15px;
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:6px;
}
.fb-ok{color:var(--ok)}
.fb-bad{color:var(--err)}

.playrow{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin:14px 0 6px;
}
.playbig{
  width:76px;height:76px;
  border-radius:50%;
  background:var(--pri);
  color:var(--on-pri);
  border:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-md);
}
.slow{
  width:52px;height:52px;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--ink-2);
  font-size:12.5px;
  font-weight:700;
}

/* Word Builder */
.ans{
  min-height:68px;
  border:1.5px dashed var(--line-strong);
  border-radius:var(--radius-md);
  padding:8px;
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  background:var(--surface);
}
.pool{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
}
.tok{
  display:inline-flex;
  align-items:center;
  min-height:42px;
  padding:6px 12px;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:var(--surface);
  font-size:15px;
  font-weight:600;
}
.tok.bad{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.blank{
  display:inline-block;
  min-width:68px;
  border-bottom:2px solid var(--pri);
  margin:0 2px;
}
.wr{color:var(--err);font-weight:700}
.rt{color:var(--ok);font-weight:700}

/* Tiles & Row Cards */
.tile{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
  text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:14px;
  min-height:102px;
  width:100%;
  box-shadow:var(--shadow-sm);
}
.tile .ti{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  background:var(--pri-soft);
  color:var(--pri);
  display:flex;align-items:center;justify-content:center;
}
.tile b{font-size:15px;line-height:1.25}
.tile span{font-size:12.5px;color:var(--ink-2);line-height:1.35}

.rowcard{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:14px;
  margin-top:10px;
  box-shadow:var(--shadow-sm);
}
.rcic{
  width:40px;height:40px;
  border-radius:var(--radius-sm);
  background:var(--pri-soft);
  color:var(--pri);
  display:flex;align-items:center;justify-content:center;
  flex:none;
  font-weight:700;
}

/* Home & Progress */
.home-hero{display:flex;align-items:center;gap:16px}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.mini{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:12px 14px;
  font-size:14px;
  font-weight:600;
}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:14px;
}
.metric b{display:block;font-size:24px;letter-spacing:-.02em}

.steps{display:flex;gap:6px;margin-bottom:14px}
.stp{
  flex:1;background:none;border:0;
  font-size:11px;font-weight:650;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;
}
.stp i{
  width:26px;height:26px;border-radius:50%;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:12px;
}
.stp.d i{background:var(--ok);color:#fff}
.stp.c{color:var(--pri)}
.stp.c i{background:var(--pri);color:var(--on-pri)}

.kchip{
  display:inline-block;font-size:12.5px;font-weight:700;
  padding:4px 10px;border-radius:8px;margin:4px 4px 0 0;
}
.kchip.ok{background:var(--ok-soft);color:var(--ok)}
.kchip.no{background:var(--err-soft);color:var(--err)}

.ach{
  display:flex;gap:12px;align-items:center;
  padding:12px 0;border-top:1px solid var(--line);
}
.ach:first-child{border-top:0;padding-top:2px}
.ach .ai{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--ink-3);flex:none;
}
.ach.got .ai{background:var(--warn-soft);color:var(--warn)}
.ach.lock{opacity:.55}

.bstat{font-size:13px;font-weight:600;color:var(--ink-3)}
.bstat.ok{color:var(--ok)}
.bstat.bad{color:var(--err)}

/* Text / Board Mode */
body.textmode .top,body.textmode nav.tabs{display:none}
body.textmode main{max-width:1080px;padding:22px 28px 56px}
.tx-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.tx-head b{flex:1;font-size:20px}
.tx-blk{margin-top:24px;padding-top:20px;border-top:1.5px solid var(--line)}
.tx-blk:first-of-type{border-top:0;padding-top:8px}
.tx-en{font-size:clamp(24px,3.2vw,40px);font-weight:750;line-height:1.2;letter-spacing:-.015em;white-space:pre-line}
.tx-pt{font-size:clamp(17px,2vw,25px);color:var(--ink-2);margin-top:8px;line-height:1.35;white-space:pre-line}

/* Toast & Modal */
#toast{
  position:fixed;left:50%;
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px);
  background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:var(--radius-md);
  font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  z-index:50;max-width:88vw;text-align:center;
  box-shadow:var(--shadow-md);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(9,14,23,.58);
  backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.sheet{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  padding:22px;width:100%;max-width:440px;
  box-shadow:var(--shadow-md);
}
.done-ic{
  width:68px;height:68px;border-radius:50%;
  background:var(--ok-soft);color:var(--ok);
  display:flex;align-items:center;justify-content:center;
  margin:4px auto 12px;
}
@media (min-width:700px){.overlay{align-items:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* compatibilidade: telas completadas a partir da 2.1.0 */
a.btn{text-decoration:none}
:root{--tx:var(--ink);--tx2:var(--ink-2);--soft:var(--surface-2);--card:var(--surface);--warm:var(--warn);--warm-soft:var(--warn-soft)}
.lbl{color:var(--tx2);font-size:13px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:8px}
.big2{font-size:21px;font-weight:650;line-height:1.3;margin-top:6px}
.ex .ibtn,.bubble .ibtn{background:var(--card)}
.hrow{margin-top:12px;flex-wrap:nowrap}
.hbtn{flex:1;min-height:44px;font-size:14px;color:var(--pri)}
.hbtn.act{background:var(--pri-soft);border-color:var(--pri)}
.ltxt{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600;font-size:17px}
.lhelp{background:var(--warm-soft);border-radius:12px;padding:10px 12px;margin-top:10px;text-align:left;font-size:14px}
.lhelp b{color:var(--warm)}

const fresh=()=>JSON.parse(JSON.stringify(DEF));
function merge(o){
  const s=fresh();
  for(const k in o){
    if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])&&o[k]&&typeof o[k]==="object"){
      Object.assign(s[k],o[k]);
    }else s[k]=o[k];
  }
  return s;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY);
    if(raw)return merge(JSON.parse(raw));
  }catch(e){}
  return fresh();
}

}
function schedulePush(ms){
  clearTimeout(pushT);
  setBoardStatus("A guardar…");
  pushT=setTimeout(pushBoard,ms==null?1100:ms);
}
async function pushBoard(){
  clearTimeout(pushT);
  const b=S.board;if(!b)return;
  const vals=b.blocks.map(x=>({mapValue:{fields:{en:{stringValue:x.en||""},pt:{stringValue:x.pt||""}}}}));
  const body={fields:{blocks:{arrayValue:vals.length?{values:vals}:{}},updated:{timestampValue:new Date().toISOString()}}};
  try{
    const r=await fetch(fbUrl(b.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    b.synced=true;save();
    setBoardStatus("Guardado e sincronizado.","ok");
  }catch(e){
    b.synced=false;save();
    setBoardStatus(navigator.onLine===false?"Sem ligação. Será enviado quando voltar.":"Falha ao guardar. Toque em Guardar agora.","bad");
  }
}
window.addEventListener("online",()=>{if(S.board&&!S.board.synced)pushBoard();});
function parseBoard(j){
  const v=(((j||{}).fields||{}).blocks||{}).arrayValue||{};
  return (v.values||[]).map(x=>{
    const f=(x.mapValue||{}).fields||{};
    return {en:(f.en||{}).stringValue||"",pt:(f.pt||{}).stringValue||""};
  });

const TTS="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
const SR_CLS=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const ACC={uk:{l:"en-gb",n:"Britânico"},us:{l:"en-us",n:"Americano"},au:{l:"en-au",n:"Australiano"},ie:{l:"en-ie",n:"Irlandês"}};
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
let VOICES=[];
const vLang=v=>v.lang.replace("_","-").toLowerCase();
function loadVoices(){
  if(!TTS)return;
  VOICES=speechSynthesis.getVoices().filter(v=>/^en-/.test(vLang(v))&&!NOVELTY.test(v.name));
}
const availAcc=()=>Object.keys(ACC).filter(k=>VOICES.some(v=>vLang(v).startsWith(ACC[k].l)));
function pickAccent(){
  const a=availAcc(),s=S.settings.accent;
  if(!a.length)return null;
  if(s!=="mix")return a.includes(s)?s:a[0];
  return a[Math.floor(Math.random()*a.length)];
}
function voiceFor(acc){
  const l=VOICES.filter(v=>vLang(v).startsWith(ACC[acc].l));
  return l.find(v=>/enhanced|premium|melhorad|aprimorad|natural/i.test(v.name))||l.find(v=>v.localService)||l[0];
}
function speak(text,slow,acc){
  if(!TTS){toast("Síntese de voz indisponível neste navegador.");return;}
  try{
    speechSynthesis.cancel();
    const a=acc||pickAccent();
    const v=a?voiceFor(a):null;
    const parts=slow?String(text).split(/\s+/).filter(Boolean):[text];
    parts.forEach(t=>{
      const u=new SpeechSynthesisUtterance(t);
      if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-US";
      u.rate=slow?0.74:S.settings.rate;
      speechSynthesis.speak(u);
    });
  }catch(e){toast("Não foi possível reproduzir o áudio.");}
}
const sayBtns=t=>TTS?`<div class="row mt"><button class="ibtn pri" data-act="say" data-t="${esc(t)}" aria-label="Ouvir">${ic("vol",19)}</button><button class="ibtn sm" data-act="say" data-t="${esc(t)}" data-slow="1" aria-label="Ouvir devagar">Lento</button></div>`:"";
const accLabel=a=>a?`<div class="center pron">Sotaque: ${ACC[a].n}</div>`:"";

let AC=null;
function beep(ok){
  if(!S.settings.sound)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    (ok?[660,880]:[300,240]).forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*.09);
      g.gain.exponentialRampToValueAtTime(0.11,t+i*.09+.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*.09+.16);
      o.connect(g).connect(AC.destination);
      o.start(t+i*.09);o.stop(t+i*.09+.18);
    });
  }catch(e){}
}

const REC=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let mr=null,recUrl=null,activeSr=null;

function stopSpeechCapture(){
  if(activeSr){try{activeSr.stop();}catch(e){}activeSr=null;}
}
function captureSpokenTo(targetSelector,btnEl){
  if(!SR_CLS){toast("Reconhecimento de fala não suportado neste navegador.");return;}
  if(activeSr){stopSpeechCapture();if(btnEl){btnEl.classList.remove("rec");btnEl.innerHTML=ic("mic",17)+" Falar em voz alta";}return;}
  try{
    const sr=new SR_CLS();
    sr.lang="en-US";
    sr.interimResults=true;
    sr.maxAlternatives=1;
    activeSr=sr;
    if(btnEl){btnEl.classList.add("rec");btnEl.innerHTML=ic("mic",17)+" Ouvindo… toque para parar";}
    sr.onresult=ev=>{
      let txt="";
      for(let i=0;i<ev.results.length;i++)txt+=ev.results[i][0].transcript+" ";
      const inp=$(targetSelector);
      if(inp){inp.value=txt.trim();inp.dispatchEvent(new Event("input",{bubbles:true}));}
    };
    sr.onerror=()=>{
      activeSr=null;
      if(btnEl){btnEl.classList.remove("rec");btnEl.innerHTML=ic("mic",17)+" Falar em voz alta";}
      toast("Não foi possível capturar a fala. Verifique o microfone.");
    };
    sr.onend=()=>{
      activeSr=null;
      if(btnEl){btnEl.classList.remove("rec");btnEl.innerHTML=ic("mic",17)+" Falar em voz alta";}
    };
    sr.start();
  }catch(e){
    activeSr=null;
    toast("Falha ao iniciar o reconhecimento de voz.");
  }
}

async function recToggle(btn,boxId="#rec"){
  if(mr&&mr.state==="recording"){mr.stop();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const ch=[];mr=new MediaRecorder(st);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};
    mr.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());
      if(recUrl)URL.revokeObjectURL(recUrl);
      recUrl=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||"audio/mp4"}));
      S.stats.spoken=(S.stats.spoken||0)+1;save();
      const box=$(boxId);
      if(box)box.innerHTML=`<button class="btn sm soft" data-act="playRec">${ic("play",15)} Ouvir minha voz</button><button class="btn sm" data-act="sayQ">${ic("vol",15)} Ouvir modelo</button>`;
      btn.classList.remove("rec");
      btn.innerHTML=ic("mic",17)+" Gravar de novo";
    };
    mr.start();
    btn.classList.add("rec");
    btn.innerHTML=ic("mic",17)+" Parar gravação";
  }catch(e){toast("Não foi possível aceder ao microfone. Verifique a permissão.");}
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const pad=n=>String(n).padStart(2,"0");
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function tNum(){return Math.floor(Date.parse(todayStr()+"T00:00:00Z")/864e5);}
const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();

let cur={s:"home"};const stack=[];let Q=null,G=null,Lc=0,gk=0,lastAct=Date.now();

function go(s,p={}){
  stopSpeechCapture();
  if(TABS.some(t=>t[0]===s))stack.length=0;
  else stack.push(cur);
  cur=Object.assign({s},p);
  render();
  window.scrollTo(0,0);
}
function back(){
  stopSpeechCapture();
  cur=stack.pop()||{s:"home"};
  render();
  window.scrollTo(0,0);
}
function headerHTML(){
  if(TABS.some(t=>t[0]===cur.s)){
    return `<div class="brand">${LOGO}<span>DriverEnglish</span></div><button class="ibtn ghost" data-act="go" data-s="settings" aria-label="Configurações">${ic("user",22)}</button>`;
  }
  const map={
    settings:"Configurações",library:"Vocabulário",phrases:"Frases profissionais",
    sims:"Simulação real",guide:"Can, Could ou May?",ask:"Como digo em inglês?",
    mine:"Minhas frases",mineAdd:"Nova frase",board:"Tela do Tesla",
    sos:"Frases salva-vidas",shadow:"Shadowing",mono:"Monólogo do dia"
  };
  let t=map[cur.s]||"";
  if(cur.s==="category")t=CATS[cur.c].n;
  if(cur.s==="game")t=G.type==="sim"?SIMS[G.si].t:GNAMES[G.type];
  if(cur.s==="session")t=S.session&&S.session.short?"Sessão de 5 min":"Sessão diária";
  if(cur.s==="myrun")t=MY[cur.m].t;
  if(cur.s==="shrun"){const sx=shadowSources().find(x=>x.k===cur.k);t=sx?sx.t:"Shadowing";}
  const closeMode=cur.s==="session"||cur.s==="game"||cur.s==="myrun"||cur.s==="shrun";
  return `<button class="ibtn ghost" data-act="back" aria-label="${closeMode?"Fechar":"Voltar"}">${ic(closeMode?"close":"back",22)}</button><div class="ttl">${esc(t)}</div><span style="width:42px"></span>`;
}
function render(){
  document.body.classList.toggle("focus",cur.s==="session"||cur.s==="game"||cur.s==="myrun"||cur.s==="shrun");
  $("#topIn").innerHTML=headerHTML();
  $("#view").innerHTML=(V[cur.s]||V.home)();
  const parent={
    library:"practice",category:"practice",phrases:"practice",sims:"practice",
    guide:"practice",myrun:"practice",ask:"home",mine:"practice",mineAdd:"practice",
    board:"practice",sos:"practice",shadow:"practice",shrun:"practice",mono:"practice"
  }[cur.s]||cur.s;
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab${parent===t[0]?" on":""}" data-act="tab" data-tab="${t[0]}"${parent===t[0]?' aria-current="page"':""}>${ic(t[2],22)}${t[1]}</button>`).join("");

/* ==================== CONSTRUTORES DE EXERCÍCIOS ==================== */
function makeMCWord(w,dir){
  const others=pickN(WORDS.filter(x=>x.id!==w.id&&x.pt!==w.pt&&x.en!==w.en),3);
  const opts=shuffle([w,...others]).map(x=>({t:dir==="en"?x.pt:x.en,ok:x.id===w.id}));
  const top=dir==="en"
    ?`<div class="muted sm">O que significa?</div><div class="en-lg mt">${esc(w.en)}</div><div class="pron">${esc(w.pr)}</div>${sayBtns(w.en)}`
    :`<div class="muted sm">Como se diz em inglês?</div><div class="en-lg mt">${esc(w.pt)}</div>`;
  return {
    type:"mc",id:w.id,say:w.en,auto:dir==="en",sayAfter:dir==="pt"?w.en:null,top,opts,
    after:`<div class="card-soft mt"><div class="en">${esc(w.en)} =${esc(w.pt)}</div><div class="mt">${esc(w.ex)}</div><div class="muted sm mt">${esc(w.expt)}</div>${sayBtns(w.ex)}</div>`
  };
}
function makeLearn(w){
  introduce(w.id);save();
  return {
    type:"learn",id:w.id,say:w.en,auto:true,
    html:`<div class="card"><div class="row"><span class="chip pri">Nova palavra</span><span class="chip">${esc(CATS[w.cat].n)}</span></div><div class="en-lg mt">${esc(w.en)}</div><div class="pron">Pronúncia aproximada: ${esc(w.pr)}</div><div class="pt">${esc(w.pt)}</div>${sayBtns(w.en)}<div class="card-soft mt"><div class="en">${esc(w.ex)}</div><div class="muted sm mt">${esc(w.expt)}</div>${sayBtns(w.ex)}</div></div><button class="btn pri wide mt" data-act="next">Continuar</button>`
  };
}
function makeListen(l){
  const acc=pickAccent();
  const top=TTS
    ?`<div class="center muted sm">O passageiro disse:</div><div class="playrow"><button class="playbig" data-act="sayQ" aria-label="Ouvir">${ic("play",32)}</button><button class="slow" data-act="sayQ" data-slow="1" aria-label="Ouvir devagar">Lento</button></div>${accLabel(acc)}<div class="row mt" style="justify-content:center"><button class="btn sm" data-act="lsText">Ver transcrição</button><button class="btn sm" data-act="lsHelp">Dica</button></div><div id="lsT" class="callout pri" hidden><b>Transcrição:</b> “${esc(l.en)}”</div><div id="lsH" class="callout warn" hidden><b>Dica:</b> ${esc(l.h)}</div><div class="center muted sm mt">Qual é o sentido?</div>`
    :`<div class="muted sm">O passageiro disse:</div><div class="en-lg mt">“${esc(l.en)}”</div><div class="row mt"><button class="btn sm" data-act="lsHelp">Dica</button></div><div id="lsH" class="callout warn" hidden><b>Dica:</b> ${esc(l.h)}</div><div class="muted sm mt">Qual é o sentido?</div>`;
  return {
    type:"mc",id:l.id,listen:true,acc,say:l.en,auto:true,top,
    opts:shuffle([{t:l.pt,ok:true},{t:l.w1,ok:false},{t:l.w2,ok:false}]),
    after:`<div class="card-soft mt"><div class="en">“${esc(l.en)}”</div><div class="pt">${esc(l.pt)}</div><div class="muted sm mt2">Resposta sugerida:</div><div class="en mt">${esc(l.r)}</div><div class="pt">${esc(l.rpt)}</div>${sayBtns(l.r)}</div>`
  };
}
function pText(p){return p.ex&&mastered(p.id)?{t:p.ex,x:true}:{t:p.en,x:false};}
const whyBox=p=>p.why?`<div class="callout warn"><b>Como funciona:</b> ${esc(p.why)}</div>`:"";
function execBox(p,usedExec){
  if(!p.ex)return "";
  if(usedExec)return `<div class="card mt"><span class="chip">Forma do dia a dia</span><div class="en mt">${esc(p.en)}</div><div class="muted sm mt">Equivalente e natural; a versão executiva apenas eleva o tom.</div>${sayBtns(p.en)}</div>`;
  return `<div class="card mt"><span class="chip exec">Versão executiva</span><div class="en mt">${esc(p.ex)}</div><div class="muted sm mt">Mais formal para atendimento executivo. Ambas estão corretas.</div>${sayBtns(p.ex)}</div>`;
}
function makePhrase(p){
  introduce(p.id);save();
  return {
    type:"phrase",id:p.id,say:p.en,auto:true,
    html:`<div class="card"><span class="chip pri">${esc(CTX[p.ctx])}</span><div class="en-lg mt">${esc(p.en)}</div><div class="pt">${esc(p.pt)}</div>${p.note?`<div class="callout pri"><b>Nota:</b> ${esc(p.note)}</div>`:""}${execBox(p,false)}<div class="row mt">${TTS?`<button class="btn sm soft" data-act="sayQ">${ic("vol",16)} Ouvir</button><button class="btn sm" data-act="sayQ" data-slow="1">Lento</button>`:""}${REC?`<button class="btn sm" data-act="rec" data-box="#rec">${ic("mic",16)} Gravar voz</button>`:""}</div><div id="rec" class="row mt"></div></div><p class="muted sm mt">Diga a frase em voz alta com clareza${REC?" e grave para comparar o ritmo com o áudio original":""}.</p><button class="btn pri wide mt" data-act="phraseDone">Repeti em voz alta</button>`
  };
}

const dictOk=l=>l.en.split(" ").length<=9;
function makeDict(l){
  const words=l.en.split(" ");
  return {type:"build",dict:true,id:l.id,say:l.en,auto:true,acc:pickAccent(),exec:false,words,pool:shuffle(words.map((t,i)=>({t,i}))),picked:[],done:false,fb:"",tries:0,bad:[],msg:""};
}
function makeBuild(p){
  const pt=pText(p),words=pt.t.split(" ");
  return {type:"build",id:p.id,say:pt.t,exec:pt.x,words,pool:shuffle(words.map((t,i)=>({t,i}))),picked:[],done:false,fb:"",tries:0,bad:[],msg:""};
}

const STOP=new Set(["the","and","you","your","for","are","our","this","that","there","with","have","was","its","but","can","will","would","could","please","here","what","about","let","may","is","it","to","a","an"]);
const clean=t=>t.toLowerCase().replace(/[.,?!“”]/g,"");
let ALLW=null;
function makeFill(p){
  const ptx=pText(p),toks=ptx.t.split(" ");
  let c=toks.map((t,i)=>({i,c:clean(t)})).filter(o=>/^[a-z]{3,}$/.test(o.c)&&!STOP.has(o.c));
  if(!c.length)c=toks.map((t,i)=>({i,c:clean(t)})).filter(o=>/^[a-z]{2,}$/.test(o.c));
  const ch=pickN(c,1)[0];
  if(!ALLW)ALLW=[...new Set(PHRASES.flatMap(x=>x.en.split(" ").map(clean)).filter(w=>/^[a-z]{3,}$/.test(w)&&!STOP.has(w)))];
  let pool=ALLW.filter(w=>w!==ch.c&&Math.abs(w.length-ch.c.length)<=3);
  if(pool.length<2)pool=ALLW.filter(w=>w!==ch.c);
  const disp=toks.map((t,i)=>{
    if(i!==ch.i)return esc(t);
    const pos=t.toLowerCase().indexOf(ch.c);
    return esc(t.slice(0,pos))+'<span class="blank"></span>'+esc(t.slice(pos+ch.c.length));
  }).join(" ");
  return {
    type:"mc",id:p.id,say:ptx.t,
    top:`<div class="muted sm">Complete a frase${ptx.x?' <span class="chip exec">executiva</span>':""}</div><div class="en-lg mt">${disp}</div><div class="pt">${esc(p.pt)}</div>`,
    opts:shuffle([{t:ch.c,ok:true},...pickN(pool,2).map(w=>({t:w,ok:false}))]),
    sayAfter:ptx.t,
    after:`<div class="card-soft mt"><div class="en">${esc(ptx.t)}</div><div class="pt">${esc(p.pt)}</div>${sayBtns(ptx.t)}</div>`+whyBox(p)+execBox(p,ptx.x)
  };
}

function makeSim(si,ti){
  const sc=SIMS[si],t=sc.turns[ti],right=t.o.find(o=>o[1]);
  return {
    type:"mc",sim:true,si,rpt:SIMPT[si][ti],last:ti===sc.turns.length-1,
    say:t.p,auto:true,acc:pickAccent(),sayAfter:right[0],
    top:`<span class="chip pri">Turno ${ti+1} de${sc.turns.length}</span><div class="bubble mt"><div class="who">Passageiro</div><div class="en">${esc(t.p)}</div><div id="ppt" class="pt" hidden>${esc(t.pt)}</div><div class="row mt">${TTS?`<button class="ibtn pri" data-act="sayQ" aria-label="Ouvir o passageiro">${ic("vol",18)}</button>`:""}<button class="link" data-act="showPt">Ver tradução</button></div></div><div class="muted sm mt2">Escolha a resposta mais adequada para falar em voz alta:</div>`,
    opts:shuffle(t.o.map(o=>({t:o[0],ok:!!o[1],fb:o[2]})))
  };
}

function makeReply(r){return {type:"reply",id:r.id,say:r.q,auto:true,acc:pickAccent(),done:false,txt:""};}
function replyHTML(q){
  const r=byId[q.id];
  return `<div class="bubble"><div class="who">Cliente</div><div class="en">${esc(r.q)}</div><div id="ppt" class="pt" hidden>${esc(r.qpt)}</div><div class="row mt">${TTS?`<button class="ibtn pri" data-act="sayQ" aria-label="Ouvir o cliente">${ic("vol",18)}</button><button class="ibtn sm" data-act="sayQ" data-slow="1">Lento</button>`:""}<button class="link" data-act="showPt">Ver tradução</button></div></div>
  <div class="callout pri"><b>Estrutura sugerida:</b> ${esc(r.frame)}</div>
  <div class="between mt2"><label class="muted sm" for="rpA">Sua resposta em inglês</label>${SR_CLS?`<button class="btn sm soft" data-act="speakTo" data-target="#rpA">${ic("mic",15)} Falar em voz alta</button>`:""}</div>
  <textarea id="rpA" placeholder="Fale no microfone ou digite sua resposta…" autocapitalize="sentences" autocomplete="off" spellcheck="false"${q.done?" disabled":""}>${esc(q.txt||"")}</textarea>
  <div id="rpOut">${q.done?replyOut(q):`<button class="btn pri wide mt" data-act="rpShow">Ver respostas modelo</button><p class="muted sm center mt">Diga em voz alta antes ou depois de comparar com os modelos.</p>`}</div>`;
}
function replyOut(q){
  const r=byId[q.id],t=" "+norm(q.txt||"")+" ";
  const got=r.keys.map(alts=>alts.some(w=>t.includes(" "+norm(w)+" ")));
  const n=got.filter(Boolean).length,empty=!norm(q.txt||"");
  const chips=r.keys.map((alts,i)=>`<span class="kchip ${got[i]?"ok":"no"}">${got[i]?"✓":"✗"} ${esc(alts[0])}</span>`).join("");
  const msg=empty?"Sem problema: ouça e repita as respostas modelo em voz alta.":n===r.keys.length?"Ótimo! Você incluiu os elementos-chave.":n?"Bom avanço. Observe os pontos marcados em vermelho.":`Experimente começar com: “${r.frame}”`;
  const lab=["Curta","Padrão","Completa"];
  return `${empty?`<p class="muted sm mt">${esc(msg)}</p>`:`<div class="card mt"><div class="muted sm">Elementos-chave</div><div class="mt">${chips}</div><p class="muted sm mt">${esc(msg)}</p></div>`}
  ${r.a.map((x,i)=>`<div class="card mt"><span class="chip${i===2?" exec":" pri"}">${lab[i]}</span><div class="en mt">${esc(x[0])}</div><div class="pt">${esc(x[1])}</div>${sayBtns(x[0])}</div>`).join("")}
  <p class="muted sm center mt2">Ouça uma das respostas e repita em voz alta. Como foi sua resposta?</p>
  <div class="grid2 mt"><button class="btn" data-act="rpRate" data-ok="0">Praticar de novo</button><button class="btn pri" data-act="rpRate" data-ok="1">Mandou bem</button></div>`;
}

function renderQ(q){
  if(q.type==="reply")return replyHTML(q);
  if(q.type==="learn"||q.type==="phrase")return q.html;
  if(q.type==="build")return `<div id="barea">${buildHTML(q)}</div>`;
  if(q.type==="flash")return flashHTML(q);
  return `<div class="card">${q.top}</div><div>${q.opts.map((o,i)=>`<button class="opt" data-act="answer" data-i="${i}">${esc(o.t)}</button>`).join("")}</div><div id="fb"></div>`;
}
function buildHTML(q){
  const p=byId[q.id];
  const top=q.dict
    ?`<div class="card center"><div class="muted sm">Ouça com atenção e monte a frase</div>${TTS?`<div class="playrow"><button class="playbig" data-act="sayQ" aria-label="Ouvir">${ic("play",32)}</button><button class="slow" data-act="sayQ" data-slow="1" aria-label="Ouvir devagar">Lento</button></div>${accLabel(q.acc)}`:`<div class="en-lg mt">“${esc(p.en)}”</div>`}${q.done?"":`<div class="row mt" style="justify-content:center"><button class="btn sm${q.help?" sel":""}" data-act="dictHelp">Dica</button></div>${q.help?`<div class="callout warn" style="text-align:left"><b>Dica:</b> ${esc(p.h)}</div>`:""}`}</div>`
    :`<div class="card"><div class="muted sm">Monte a frase em inglês${q.exec?' <span class="chip exec">executiva</span>':""}</div><div class="en-lg mt">${esc(p.pt)}</div></div>${q.done?"":`<div class="callout pri"><b>Atenção:</b> repita a frase em voz alta ao montar. Maiúsculas e pontuação ajudam a fixar a estrutura.</div>`}`;
  return top+`
  <div class="ans">${q.picked.length?q.picked.map((k,j)=>`<button class="tok${q.bad.includes(j)?" bad":""}" data-act="unpick" data-j="${j}"${q.done?" disabled":""}>${esc(q.pool[k].t)}</button>`).join(""):'<span class="muted sm" style="padding:6px">Toque nas palavras na ordem correta</span>'}</div>
  <div class="pool">${q.pool.map((o,k)=>q.picked.includes(k)?"":`<button class="tok" data-act="pick" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
  <div id="berr" class="callout err" style="display:none"></div>${q.done?"":q.msg}${q.done?"":'<button class="btn pri wide mt" data-act="check">Verificar</button>'}<div id="fb">${q.fb}</div>`;
}
function flashHTML(q){
  const w=byId[q.id];

const nextBtn=()=>`<button class="btn pri wide mt" data-act="next">Continuar</button>`;

function answer(i){
  if(!Q||Q.done)return;
  Q.done=true;
  const o=Q.opts[i],ok=o.ok;
  document.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled=true;
    if(Q.opts[j].ok)b.classList.add("right");
    else if(j===i)b.classList.add("wrong");
  });
  beep(ok);
  if(Q.id)grade(Q.id,ok);else{S.stats.answers++;if(ok)S.stats.correct++;}
  if(Q.listen&&ok)S.stats.listenOk++;
  if(cur.s==="session"){S.session.n=(S.session.n||0)+1;if(ok)S.session.ok=(S.session.ok||0)+1;}
  if(cur.s==="game"&&ok)G.ok++;

  let after=Q.after||"";
  if(Q.sim){
    const r=Q.opts.find(x=>x.ok);
    const pp=$("#ppt");if(pp)pp.hidden=false;
    after=`<div class="card-soft mt">${ok?"":`<div class="callout err" style="margin-top:0;margin-bottom:10px">${esc(o.fb)}</div><div class="muted sm">Resposta recomendada:</div>`}<div class="en mt">${esc(r.t)}</div><div class="pt">${esc(Q.rpt)}</div><p class="muted sm mt">${esc(r.fb)}</p><div class="row mt">${TTS?`<button class="ibtn pri" data-act="say" data-t="${esc(r.t)}" aria-label="Ouvir resposta">${ic("vol",18)}</button>`:""}${REC?`<button class="btn sm" data-act="rec" data-box="#simRec">${ic("mic",15)} Falar e gravar</button>`:""}</div><div id="simRec" class="row mt"></div></div>`;
    if(Q.last)S.sims[Q.si]=1;
  }
  save();checkAch();
  $("#fb").innerHTML=(ok?`<div class="fb-ok">${ic("check",19)} Resposta certa</div>`:`<div class="fb-bad">${ic("close",18)} Veja a opção destacada em verde</div>`)+after+nextBtn();
  if(Q.sayAfter)speak(Q.sayAfter,false,Q.acc);
}

function checkBuild(){
  const q=Q;if(q.done)return;
  const errEl=$("#berr");
  if(q.picked.length<q.pool.length){
    if(errEl){errEl.style.display="block";errEl.textContent="Use todas as palavras antes de verificar.";}
    return;
  }
  if(errEl)errEl.style.display="none";
  const mine=q.picked.map(k=>q.pool[k].t),bad=[];
  mine.forEach((t,j)=>{if(t!==q.words[j])bad.push(j);});
  const ok=!bad.length,p=byId[q.id];
  if(!ok&&q.tries===0){
    q.tries=1;q.bad=bad;beep(false);
    q.msg=`<div class="callout err"><b>Quase:</b> as palavras em vermelho podem precisar de ajuste. Toque nelas para remover e tente novamente.</div>`;
    $("#barea").innerHTML=buildHTML(q);return;
  }
  q.done=true;beep(ok);
  if(ok&&q.tries===0)grade(q.id,true);else if(ok)softGrade(q.id);else grade(q.id,false);
  if(cur.s==="session"){S.session.n=(S.session.n||0)+1;if(ok)S.session.ok=(S.session.ok||0)+1;}
  if(cur.s==="game"&&ok)G.ok++;
  save();checkAch();

  let h;
  if(ok){
    h=`<div class="fb-ok">${ic("check",19)} Correto${q.tries?" na segunda tentativa":""}</div><div class="card-soft mt"><div class="en">${esc(q.say)}</div><div class="pt">${esc(p.pt)}</div>${sayBtns(q.say)}</div>`;
  }else{
    h=`<div class="fb-bad">Comparação</div><div class="card mt"><div class="muted sm">Você montou</div><div class="mt">${mine.map((t,j)=>bad.includes(j)?`<span class="wr">${esc(t)}</span>`:esc(t)).join(" ")}</div><div class="muted sm mt">Forma esperada</div><div class="en mt">${q.words.map((t,j)=>bad.includes(j)?`<span class="rt">${esc(t)}</span>`:esc(t)).join(" ")}</div><div class="pt">${esc(p.pt)}</div>${sayBtns(q.say)}</div>`;
  }
  const rb=q.dict?`<div class="card-soft mt"><div class="muted sm">Como responder:</div><div class="en mt">${esc(p.r)}</div><div class="pt">${esc(p.rpt)}</div>${sayBtns(p.r)}</div>`:"";
  if(q.dict&&ok)S.stats.listenOk++;
  q.bad=ok?[]:bad;
  q.fb=h+rb+whyBox(p)+execBox(p,q.exec)+nextBtn();
  $("#barea").innerHTML=buildHTML(q);
  speak(q.say,false,q.acc);
}

/* ==================== SESSÃO & JOGOS ==================== */
function buildSession(short){
  const st=[];
  dueList(WORDS).slice(0,short?3:5).forEach(w=>st.push({k:"mcw",id:w.id,dir:Math.random()<.5?"en":"pt"}));
  if(!short){
    const nw=unseen(WORDS).slice(0,3);
    nw.forEach(w=>st.push({k:"learn",id:w.id}));
    nw.forEach(w=>st.push({k:"mcw",id:w.id,dir:"en"}));
  }
  const ls=[...new Set([...dueList(LISTEN),...unseen(LISTEN)])];
  const lsel=(ls.length?ls:pickN(LISTEN,3)).slice(0,short?2:3);
  lsel.forEach(l=>st.push({k:"listen",id:l.id}));
  if(!short){const sx=dueList(SOS)[0]||unseen(SOS)[0];if(sx)st.push({k:"sos",id:sx.id});}
  if(!short){const rp=dueList(REPLY)[0]||unseen(REPLY)[0];if(rp)st.push({k:"reply",id:rp.id});}
  if(!short&&S.mine.length){
    const mp=S.mine.map(m=>byId[m.id]).filter(Boolean);
    const pick=dueList(mp)[0]||unseen(mp)[0];
    if(pick)st.push({k:"build",id:pick.id});
  }
  const ps=[...new Set([...dueList(PHRASES),...unseen(PHRASES)])];
  const pp=(ps.length?ps:pickN(PHRASES,2)).slice(0,short?1:2);
  pp.forEach(p=>st.push({k:"phrase",id:p.id}));
  if(!short){
    pp.forEach(p=>st.push({k:pText(p).t.split(" ").length<=9?"build":"fill",id:p.id}));
    let si=SIMS.findIndex((_,i)=>!S.sims[i]);
    if(si<0)si=Math.floor(Math.random()*SIMS.length);
    SIMS[si].turns.forEach((_,ti)=>st.push({k:"sim",si,ti}));
  }
  return {date:todayStr(),short,steps:st,i:0,n:0,ok:0,done:false};
}
function stepQ(st){
  switch(st.k){
    case"mcw":return makeMCWord(byId[st.id],st.dir);
    case"learn":return makeLearn(byId[st.id]);
    case"listen":return makeListen(byId[st.id]);
    case"phrase":return makePhrase(byId[st.id]);
    case"dict":return makeDict(byId[st.id]);
    case"reply":return makeReply(byId[st.id]);
    case"sos":return makeSos(byId[st.id]);
    case"build":return makeBuild(byId[st.id]);
    case"fill":return makeFill(byId[st.id]);
    case"sim":return makeSim(st.si,st.ti);
  }
}
function startSession(short){
  const ses=S.session&&S.session.date===todayStr()?S.session:null;
  if(!(ses&&!ses.done&&!short))S.session=buildSession(!!short);
  save();go("session");autoSpeak();
}

function practiceWord(ex){
  const d=dueList(WORDS).filter(w=>!ex.has(w.id));if(d.length)return d[0];
  const sn=WORDS.filter(w=>seen(w.id)&&!ex.has(w.id));if(sn.length>=6)return pickN(sn,1)[0];
  return unseen(WORDS).filter(w=>!ex.has(w.id))[0]||pickN(WORDS.filter(w=>!ex.has(w.id)),1)[0];
}
function practicePhrase(ex,shortOnly){
  const pool=PHRASES.filter(p=>!ex.has(p.id)&&(!shortOnly||pText(p).t.split(" ").length<=9));
  const d=dueList(pool);if(d.length)return d[0];
  const sn=pool.filter(p=>seen(p.id));if(sn.length>=5)return pickN(sn,1)[0];
  return pickN(pool,1)[0];
}
function gameQ(){
  const g=G;
  if(g.type==="sim")return makeSim(g.si,g.n);
  if(g.type==="sos"){const pool=SOS.filter(x=>!g.used.has(x.id));const x=(dueList(pool)[0]||unseen(pool)[0]||pickN(pool,1)[0]);g.used.add(x.id);return makeSos(x);}
  if(g.type==="reply"){const pool=REPLY.filter(r=>!g.used.has(r.id));const r=(dueList(pool)[0]||unseen(pool)[0]||pickN(pool,1)[0]);g.used.add(r.id);return makeReply(r);}
  if(g.type==="mine"){const pool=S.mine.map(m=>byId[m.id]).filter(p=>p&&!g.used.has(p.id));const p=(dueList(pool)[0]||unseen(pool)[0]||pickN(pool,1)[0]);g.used.add(p.id);return makeBuild(p);}
  if(g.type==="dict"){const pool=LISTEN.filter(l=>dictOk(l)&&!g.used.has(l.id));const l=(dueList(pool)[0]||unseen(pool)[0]||pickN(pool,1)[0]);g.used.add(l.id);return makeDict(l);}
  if(g.type==="flash"){const w=practiceWord(g.used);g.used.add(w.id);introduce(w.id);return {type:"flash",id:w.id,say:w.en,auto:true,rev:false};}
  if(g.type==="quiz"){const w=practiceWord(g.used);g.used.add(w.id);introduce(w.id);return makeMCWord(w,Math.random()<.5?"en":"pt");}
  const p=practicePhrase(g.used,g.type==="build");g.used.add(p.id);
  return g.type==="fill"?makeFill(p):makeBuild(p);
}
function startGame(type,si){
  gk++;
  G={type,si:si===undefined?null:+si,n:0,ok:0,used:new Set(),total:type==="sim"?SIMS[+si].turns.length:type==="dict"?8:type==="mine"?Math.min(10,S.mine.length):type==="sos"?8:10};
  if(cur.s==="game"){cur={s:"game"};render();}else go("game");
  window.scrollTo(0,0);autoSpeak();
}

  const ss=S.session;if(!ss)return V.home();
  if(ss.i>=ss.steps.length){
    if(!ss.done){ss.done=true;S.stats.sessions++;const d=todayStr();S.days[d]=Math.max(S.days[d]||0,60);save();checkAch();}
    return `<div class="card center mt2"><div class="done-ic">${ic("check",34)}</div><h1>Sessão concluída</h1><p class="muted mt">${ss.n?`${ss.ok} de ${ss.n} respostas certas. `:""}A revisão espaçada trará de volta o que merece reforço.</p></div>

    <button class="btn wide mt" data-act="tab" data-tab="listen">Continuar na escuta ativa</button>`;
  }
  const key="S"+ss.date+":"+ss.i+":"+ss.steps.length;
  if(Q&&Q.key===key&&Q.done){ss.i++;save();return V.session();}
  const st0=ss.steps[ss.i];
  if(st0.id&&!byId[st0.id]){ss.i++;save();return V.session();}

  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${ss.steps.length}" aria-valuenow="${ss.i}"><div style="width:${Math.round(ss.i/ss.steps.length*100)}%"></div></div>${renderQ(Q)}`;
};

 if(st===2){const key="M2:"+i+":"+cur.j;if(!Q||Q.key!==key){Q=makeBuild(byId["m"+i+"s"+cur.j]);Q.key=key;}return chips+`<div class="lbl" style="margin-bottom:8px">Frase ${cur.j+1} de ${n}</div>`+renderQ(Q);}

let SIDX=null;
const SW=t=>norm(t).split(" ").filter(Boolean);
function searchIndex(){
 const L=[];
 WORDS.forEach(w=>L.push({k:"Palavra",en:w.en,pt:w.pt,ex:w.ex,expt:w.expt,h:SW(w.pt+" "+w.expt),e:SW(w.en+" "+w.ex)}));
 PHRASES.forEach(p=>L.push({k:"Frase",en:p.en,pt:p.pt,alt:p.ex,h:SW(p.pt),e:SW(p.en+" "+(p.ex||""))}));
 LISTEN.forEach(l=>{L.push({k:"O cliente diz",en:l.en,pt:l.pt,h:SW(l.pt),e:SW(l.en)});L.push({k:"Resposta",en:l.r,pt:l.rpt,h:SW(l.rpt),e:SW(l.r)});});
 SOS.forEach(x=>L.push({k:"Salva-vidas",en:x.en,pt:x.pt,h:SW(x.pt+" "+x.sit),e:SW(x.en)}));
 MY.forEach(m=>m.s.forEach(x=>L.push({k:"Minhas respostas",en:x[0],pt:x[1],h:SW(x[1]),e:SW(x[0])})));
 return L;
}
/* palavras que não ajudam na busca */
const STOPQ=new Set("eu o a os as um uma uns umas de do da dos das em no na nos nas para pra por com que e se me te lhe ele ela eles elas voce voces meu minha meus minhas seu sua seus suas aqui ali la isso isto esse essa este esta como digo dizer falar ingles quero ao aos mais ja the to of and i you".split(" "));
/* raiz simples: “fecho”, “fechar” e “fechado” viram “fech” */
const root=w=>w.length<=3?w:w.length<=5?w.slice(0,-1):w.slice(0,-2);
function searchFor(q){
 const t=[...new Set(SW(q).filter(w=>!STOPQ.has(w)))].map(root);
 if(!t.length)return [];
 if(!SIDX)SIDX=searchIndex();
 const all=S.mine.map(m=>({k:"Minha frase",en:m.en,pt:m.pt,h:SW(m.pt),e:SW(m.en)})).concat(SIDX);
 const hit=(arr,r)=>arr.some(x=>x.startsWith(r));
 const need=t.length>1?Math.ceil(t.length/2):1;
 return all.map(o=>{let n=0,sc=0;for(const r of t){if(hit(o.h,r)){n++;sc+=2;}else if(r.length>=3&&hit(o.e,r)){n++;sc+=1;}}
  if(n<need)return null;if(o.k==="Minha frase")sc+=3;if(o.k==="Frase")sc+=1;sc-=o.h.length*0.05;return {o,n,sc};})
  .filter(Boolean).sort((a,b)=>b.n-a.n||b.sc-a.sc).slice(0,20).map(x=>x.o);
}

 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(fb);else fb();
}

const splitS=t=>String(t||"").split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
function shadowSources(){
 const L=[];
 MY.forEach((m,i)=>L.push({k:"my"+i,t:m.t,sub:"Minhas respostas",s:m.s.map(x=>[x[0],x[1]])}));
 if(S.board&&S.board.blocks&&S.board.blocks.length){const out=[];S.board.blocks.forEach(b=>{const e=splitS(b.en),p=splitS(b.pt);e.forEach((x,i)=>out.push([x,e.length===p.length?p[i]:(i===0?b.pt:"")]));});if(out.length)L.push({k:"board",t:"Tela do Tesla",sub:"O seu texto do carro",s:out});}
 if(S.mine.length)L.push({k:"mine",t:"Minhas frases",sub:S.mine.length+(S.mine.length===1?" frase":" frases"),s:S.mine.map(m=>[m.en,m.pt])});
 L.push({k:"sos",t:"Frases salva-vidas",sub:"Para quando travar",s:SOS.map(x=>[x.en,x.pt])});
 L.push({k:"car",t:"No carro",sub:"Frases de ações no carro",s:PHRASES.filter(p=>p.ctx==="carro").map(p=>[p.en,p.pt])});
 return L;
}

async function monoRec(btn){
 if(!REC){if(monoTimer){clearInterval(monoTimer);monoTimer=null;btn.innerHTML=ic("mic",18)+" Começar a falar";return;}monoStart=Date.now();monoTimer=setInterval(monoTick,250);btn.innerHTML=ic("close",18)+" Parar";return;}
 if(mr&&mr.state==="recording"){mr.stop();return;}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];mr=new MediaRecorder(st);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(monoTimer);monoTimer=null;if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||"audio/mp4"}));

   const box=$("#mrec");if(box)box.innerHTML=`<button class="btn" data-act="playRec">${ic("play",16)} Ouvir minha voz</button>`;};
  mr.start();monoStart=Date.now();monoTimer=setInterval(monoTick,250);btn.classList.add("on");btn.innerHTML=ic("mic",18)+" Parar gravação";

V.category=()=>WORDS.filter(w=>w.cat===cur.c).map(w=>`<div class="card mt"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="en" style="font-size:20px">${esc(w.en)}</div><div class="pron">${esc(w.pr)}</div><div class="pt" style="margin-top:4px">${esc(w.pt)}</div></div>${TTS?`<button class="ibtn" data-act="say" data-t="${esc(w.en)}" aria-label="Ouvir ${esc(w.en)}">${ic("vol",20)}</button>`:""}</div><div class="ex"><div>${esc(w.ex)}</div><div class="lbl">${esc(w.expt)}</div>${sayBtns(w.ex)}</div><button class="btn wide mt${learned(w.id)?" sel":""}" data-act="known" data-id="${w.id}" style="${learned(w.id)?"color:var(--ok);border-color:var(--ok)":""}">${learned(w.id)?ic("check",18)+" Aprendida":"Marcar como aprendida"}</button></div>`).join("");
V.phrases=()=>`<p class="lbl">Cada frase está na forma do dia a dia. Quando existe uma forma mais formal, ela aparece como versão executiva.</p>`+Object.keys(CTX).map(k=>`<h2>${CTX[k]}</h2>`+PHRASES.filter(p=>p.ctx===k).map(p=>`<div class="card mt"><div class="en">${esc(p.en)}</div><div class="lbl" style="font-size:15px;margin-top:4px">${esc(p.pt)}</div>${p.note?`<div class="note">Dica: ${esc(p.note)}</div>`:""}${sayBtns(p.en)}${execBox(p,false)}${whyBox(p)}</div>`).join("")).join("");
const GUIDE=[
{t:"Posso…? (você pede para fazer algo)",r:[["Can I help you?","Dia a dia","Sempre certo."],["Could I help you?","Educado","Um pouco mais gentil."],["May I help you?","Executivo","O mais formal, típico de hotel e transfer executivo."]]},
{t:"Pode…? (você pede algo ao cliente)",r:[["Can you repeat that?","Dia a dia","Sempre certo."],["Could you repeat that?","Educado","Mais gentil, ótimo com qualquer cliente."],["Would you repeat that, please?","Executivo","Muito formal."]]},
{t:"Quer…? (você oferece algo)",r:[["Do you want some water?","Dia a dia","Certo, mas direto."],["Would you like some water?","Educado e executivo","A forma mais usada com clientes."]]}
];
V.guide=()=>`<p class="lbl" style="font-size:15px">Todas significam “posso”, “pode” ou “quer”. O que muda é o nível de educação. Todas estão certas: comece pelo dia a dia e use as outras quando se sentir à vontade.</p>`+GUIDE.map(g=>`<h2>${esc(g.t)}</h2><div class="card">${g.r.map((r,i)=>`<div style="padding:10px 0;${i?"border-top:1px solid var(--line)":""}"><span class="chip${r[1]==="Dia a dia"?"":" exec"}">${esc(r[1])}</span><div class="en mt">${esc(r[0])}</div><div class="lbl">${esc(r[2])}</div>${sayBtns(r[0])}</div>`).join("")}</div>`).join("")+`<div class="why"><b>Dica:</b> nos exercícios, a resposta esperada é a do dia a dia. Quando você dominar uma frase, o app passa a cobrar a versão executiva dela.</div>`;
V.progress=()=>{
 const acc=S.stats.answers?Math.round(S.stats.correct/S.stats.answers*100):0;
 const mins=Math.round(Object.values(S.days).reduce((a,b)=>a+b,0)/60);
 const ph=PHRASES.filter(p=>seen(p.id)).length,ms=WORDS.filter(w=>mastered(w.id)).length;
 const rev=WORDS.filter(w=>seen(w.id)&&(S.items[w.id].w>0&&S.items[w.id].b<3||S.items[w.id].d<=tNum())).sort((a,b)=>S.items[b.id].w-S.items[a.id].w).slice(0,12);
 const m=(v,l)=>`<div class="metric"><b>${v}</b><span class="lbl">${l}</span></div>`;
 return `<div class="metrics" style="margin-top:6px">${m(learnedCount()+"/"+WORDS.length,"palavras aprendidas")}${m(ms,"palavras dominadas")}${m(ph+"/"+PHRASES.length,"frases praticadas")}${m(S.stats.answers?acc+"%":"–","de acertos")}${m(mins,"minutos de estudo")}${m(practicedDays(),"dias de prática")}</div>
 <p class="note">Uma palavra fica “dominada” depois de acertos em dias diferentes.</p>
 <h2>Por tema</h2><div class="card">${CATS.map((c,ci)=>{const ws=WORDS.filter(w=>w.cat===ci),l=ws.filter(w=>learned(w.id)).length,d=ws.filter(w=>mastered(w.id)).length;return `<div style="margin:8px 0 14px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${esc(c.n)}</b><span class="lbl">${l}/10${d?`, ${d} dominadas`:""}</span></div><div class="bar"><div style="width:${l*10}%"></div></div></div>`;}).join("")}</div>
 <h2>Precisam de revisão</h2>${rev.length?`<div class="card">${rev.map(w=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span><b>${esc(w.en)}</b> <span class="lbl">${esc(w.pt)}</span></span>${TTS?`<button class="ibtn" data-act="say" data-t="${esc(w.en)}" aria-label="Ouvir ${esc(w.en)}">${ic("vol",18)}</button>`:""}</div>`).join("")}</div><button class="btn pri wide mt" data-act="game" data-g="quiz">Revisar agora</button>`:`<p class="note">Nada pendente. As palavras que você errar aparecem aqui.</p>`}
 <h2>Conquistas</h2><div class="card">${ACH.map(a=>`<div class="ach ${S.ach[a.k]?"got":"lock"}"><span class="ai">${ic("star",20)}</span><span><b style="font-size:15px">${a.t}</b><br><span class="lbl">${a.d}</span></span></div>`).join("")}</div>
 <h2>Cópia de segurança</h2><p class="note" style="margin-top:0">O progresso fica guardado neste aparelho. Salve uma cópia de vez em quando para não perder nada.</p><div class="grid2 mt"><button class="btn" data-act="export">${ic("down",18)} Salvar cópia</button><button class="btn" data-act="import">${ic("up",18)} Restaurar</button></div>`;
};
V.settings=()=>{
 const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="btn${String(S.settings[k])===String(v)?" sel":""}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div>`;
 const av=availAcc();
 const accOpts=[["mix","Variado"],...Object.keys(ACC).filter(k=>av.includes(k)).map(k=>[k,ACC[k].n])];
 return `<div class="set"><label class="lbl" for="nm2">Seu nome</label><input id="nm2" type="text" value="${esc(S.name)}" maxlength="30" autocomplete="given-name" placeholder="Seu nome"></div>
 <div class="set"><div class="lbl">Meta diária</div>${seg("goal",[[5,"5 min"],[10,"10 min"],[15,"15 min"]])}</div>
 <div class="set"><div class="lbl">Tema</div>${seg("theme",[["light","Claro"],["auto","Automático"],["dark","Escuro"]])}</div>
 <div class="set"><div class="lbl">Sotaque das vozes</div>${TTS?(av.length?seg("accent",accOpts):`<p class="note">Nenhuma voz em inglês encontrada ainda.</p>`):`<p class="note">Este navegador não tem voz sintetizada.</p>`}</div>
 <div class="set"><div class="lbl">Velocidade normal da voz</div>${seg("rate",[[0.75,"Devagar"],[0.95,"Normal"],[1.1,"Rápida"]])}<p class="note">O botão “Lento” fala palavra por palavra, para você separar cada uma.</p></div>
 <div class="set"><div class="lbl">Sons de acerto e erro</div>${seg("sound",[["true","Ligados"],["false","Desligados"]])}</div>
 ${TTS?`<button class="btn wide mt2" data-act="testVoice">${ic("vol",18)} Testar voz</button>`:""}
 <p class="note">Para vozes mais naturais e mais sotaques no iPhone: abra Ajustes e pesquise “Vozes”. Ou vá em Ajustes › Acessibilidade › Ler e Falar › Vozes › Inglês (em versões antigas do iOS: Conteúdo Falado). Baixe vozes “Melhorada” ou “Premium” e depois feche e reabra o app.</p>
 <div class="safe">${ic("car",22)}<span>Use o app só com o carro parado.</span></div>
 <h2>Lembrete diário</h2><p class="note" style="margin-top:0">Crie um lembrete no app Lembretes do iPhone, por exemplo “Praticar inglês, 10 min”, no horário em que costuma esperar clientes.</p>
 <button class="btn wide mt2" data-act="reset" style="color:var(--err)">Apagar todo o progresso</button><p class="note center">DriverEnglish 3.0.0</p>`;
};

/* ---------- Ações ---------- */
function toggleKnown(id){const x=it(id);if(learned(id)){x.b=0;x.d=tNum();}else{x.s=1;x.b=Math.max(x.b,1);x.d=tNum()+1;}save();checkAch();const y=window.scrollY;render();window.scrollTo(0,y);}
function setSetting(k,v){
 if(k==="goal")v=+v;else if(k==="rate")v=+v;else if(k==="sound")v=v==="true";
 S.settings[k]=v;save();if(k==="theme")applyTheme();const y=window.scrollY;render();window.scrollTo(0,y);
 if(k==="accent"||k==="rate")speak("Hello, welcome to Lisbon.",false,v==="mix"?null:(k==="accent"?v:null));
}
function applyTheme(){
 const t=S.settings.theme;document.documentElement.dataset.theme=t;
 const dark=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#07111F":"#F3F6FA";
}
async function exportData(){
 const name="driverenglish-progresso-"+todayStr()+".json",blob=new Blob([JSON.stringify(S)],{type:"application/json"});
 try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Progresso DriverEnglish"});return;}}
 catch(e){if(e&&e.name==="AbortError")return;}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Cópia salva");
}
const A={
 tab:d=>{go(d.tab);if(d.tab==="listen")autoSpeak();},
 go:d=>go(d.s,d.c!==undefined?{c:+d.c}:{}),
 back:()=>back(),
 say:d=>speak(d.t,!!d.slow),
 sayQ:d=>{if(Q&&Q.say)speak(Q.say,!!d.slow,Q.acc);},
 start:()=>startSession(false),
 startShort:()=>startSession(true),
 answer:d=>answer(+d.i),
 next:()=>{
  if(cur.s==="session"){S.session.i++;save();}
  else if(cur.s==="game")G.n++;
  else if(cur.s==="listen")Lc++;
  else if(cur.s==="myrun"){cur.j++;if(cur.j>=MY[cur.m].s.length){cur.st=3;cur.j=0;}render();window.scrollTo(0,0);if(cur.st===3)speak(MY[cur.m].q);return;}
  render();window.scrollTo(0,0);autoSpeak();
 },
 reveal:()=>{Q.rev=true;render();},
 flashGrade:d=>{const ok=d.ok==="1";grade(Q.id,ok);if(ok)G.ok++;save();checkAch();G.n++;render();window.scrollTo(0,0);autoSpeak();},
 pick:d=>{if(Q.done)return;Q.picked.push(+d.k);Q.bad=[];Q.msg="";$("#barea").innerHTML=buildHTML(Q);},
 unpick:d=>{if(Q.done)return;Q.picked.splice(+d.j,1);Q.bad=[];Q.msg="";$("#barea").innerHTML=buildHTML(Q);},
 check:()=>checkBuild(),
 phraseDone:()=>{S.stats.phrasesPracticed++;const x=it(Q.id);x.pr=(x.pr||0)+1;save();A.next();},
 rec:(d,el)=>recToggle(el),
 playRec:()=>{if(recUrl)new Audio(recUrl).play().catch(()=>toast("Não foi possível tocar a gravação"));},
 game:d=>startGame(d.g,d.si),
 again:()=>startGame(G.type,G.si),
 known:d=>toggleKnown(d.id),
 set:d=>setSetting(d.k,d.v),
 testVoice:()=>speak("Good morning. Welcome to Lisbon. I’m your driver today."),
 export:()=>exportData(),
 import:()=>$("#imp").click(),
 reset:()=>{if(confirm("Apagar todo o progresso? Isto não pode ser desfeito.")){const n=S.name,st=S.settings;S=fresh();S.name=n;S.settings=st;S.onboarded=true;Q=null;save();go("home");toast("Progresso apagado");}},
 myStart:d=>{const m=+d.m;Q=null;if(cur.s==="myrun"){cur={s:"myrun",m,st:0,j:0,ok:false};render();window.scrollTo(0,0);}else go("myrun",{m,st:0,j:0,ok:false});speak(MY[m].q);},
 myStep:d=>{cur.st=+d.st;cur.j=0;Q=null;render();window.scrollTo(0,0);if(cur.st===1)speak(MY[cur.m].s[0][0]);if(cur.st===3)speak(MY[cur.m].q);},
 myRep:()=>{cur.j++;if(cur.j>=MY[cur.m].s.length){cur.st=2;cur.j=0;}render();window.scrollTo(0,0);if(cur.st===1)speak(MY[cur.m].s[cur.j][0]);},
 myReveal:()=>{const x=$("#myAns");if(x)x.hidden=!x.hidden;},
 myDone:d=>{const ok=d.ok==="1";grade("m"+cur.m,ok);save();checkAch();cur.st=4;cur.ok=ok;render();window.scrollTo(0,0);},
 rpShow:()=>{if(!Q||Q.type!=="reply"||Q.done)return;const t=$("#rpA");Q.txt=t?t.value:"";Q.done=true;if(t)t.disabled=true;$("#rpOut").innerHTML=replyOut(Q);const pp=$("#ppt");if(pp)pp.hidden=false;},
 rpRate:d=>{if(!Q||Q.type!=="reply"||Q.rated)return;Q.rated=true;const ok=d.ok==="1";grade(Q.id,ok);
  if(cur.s==="session"){S.session.n=(S.session.n||0)+1;if(ok)S.session.ok=(S.session.ok||0)+1;}
  if(cur.s==="game"&&ok)G.ok++;save();checkAch();A.next();},
 shStart:d=>{Q=null;go("shrun",{k:d.k,ph:0,j:0});},
 shPhase:d=>{cur.ph=+d.ph;cur.j=0;Q=null;render();window.scrollTo(0,0);if(cur.ph===1||cur.ph===2)autoSh();},
 shNext:()=>{const src=shadowSources().find(x=>x.k===cur.k);if(!src)return;cur.j++;if(cur.j>=src.s.length){if(cur.ph===1){cur.ph=2;cur.j=0;}else{cur.ph=3;S.stats.phrasesPracticed++;save();}}render();window.scrollTo(0,0);if(cur.ph===1||cur.ph===2)autoSh();},
 shPeek:()=>{const x=$("#shTxt");if(x)x.hidden=!x.hidden;},
 monoRec:(d,el)=>monoRec(el),
 monoEx:()=>{const x=$("#monoEx");if(x)x.hidden=!x.hidden;},
 monoNext:()=>{cur.mi=(monoIdx()+1)%MONO.length;if(monoTimer){clearInterval(monoTimer);monoTimer=null;}render();window.scrollTo(0,0);},
 monoDone:()=>{S.mono=S.mono||{};S.mono[todayStr()]=1;const d=todayStr();S.days[d]=Math.max(S.days[d]||0,60);save();checkAch();toast("Muito bem! Amanhã tem tema novo.");render();},
 speakTo:(d,el)=>captureSpokenTo(d.target,el),
 boardCopy:()=>copyText(boardLink(),"Link copiado"),
 boardRetry:()=>{setBoardStatus("A guardar…");pushBoard();},
 bMove:d=>{const i=+d.i,j=i+(+d.d),b=S.board.blocks;if(j<0||j>=b.length)return;[b[i],b[j]]=[b[j],b[i]];S.board.synced=false;save();const y=window.scrollY;render();window.scrollTo(0,y);schedulePush(0);},
 bDel:d=>{if(!confirm("Apagar este bloco?"))return;S.board.blocks.splice(+d.i,1);S.board.synced=false;save();const y=window.scrollY;render();window.scrollTo(0,y);schedulePush(0);},
 bAdd:()=>{S.board.blocks.push({en:"",pt:""});S.board.synced=false;save();render();window.scrollTo(0,document.body.scrollHeight);const t=document.querySelectorAll('textarea[data-f="en"]');if(t.length)t[t.length-1].focus();},
 bNewLink:()=>{if(!confirm("Gerar um link novo? O link antigo deixa de ser atualizado."))return;S.board.id=newBoardId();S.board.synced=false;save();render();pushBoard();toast("Link novo criado. Copie e abra no Tesla.");},
 txTheme:()=>{S.settings.theme=S.settings.theme==="dark"?"light":"dark";save();applyTheme();},
 ask:()=>{go("ask",{q:""});const i=$("#askQ");if(i)i.focus();},
 copyQ:()=>copyText(claudeQ(cur.q||"")),
 copyQ2:()=>{const v=($("#mPt").value||"").trim();if(!v){$("#mErr").textContent="Escreva primeiro a frase em português.";return;}copyText(claudeQ(v));},
 mineNew:()=>go("mineAdd",{pt:cur.s==="ask"?(cur.q||""):""}),
 mineSave:()=>{const pt=($("#mPt").value||"").trim().replace(/\s+/g," "),en=($("#mEn").value||"").trim().replace(/\s+/g," ");
  if(!pt||!en){$("#mErr").textContent="Preencha o português e o inglês.";return;}
  if(!/[a-z]/i.test(en)){$("#mErr").textContent="A frase em inglês parece vazia.";return;}
  const m={id:"u"+Date.now().toString(36),pt,en};S.mine.push(m);regMine(m);save();toast("Frase salva");
  stack.length=0;stack.push({s:"practice"});cur={s:"mine"};render();window.scrollTo(0,0);speak(en);},
 mineDel:d=>{if(!confirm("Apagar esta frase?"))return;S.mine=S.mine.filter(m=>m.id!==d.id);delete S.items[d.id];delete byId[d.id];save();const y=window.scrollY;render();window.scrollTo(0,y);},
 dictHelp:()=>{if(!Q||!Q.dict)return;Q.help=!Q.help;$("#barea").innerHTML=buildHTML(Q);},
 lsText:(d,el)=>{const x=$("#lsT");if(x){x.hidden=!x.hidden;el.classList.toggle("act",!x.hidden);}},
 lsHelp:(d,el)=>{const x=$("#lsH");if(x){x.hidden=!x.hidden;el.classList.toggle("act",!x.hidden);}},
 showPt:()=>{const x=$("#ppt");if(x)x.hidden=!x.hidden;},
 onboard:()=>{S.name=($("#nm").value||"").trim().slice(0,30);S.onboarded=true;save();$("#modal").innerHTML="";render();}
};
document.addEventListener("click",e=>{lastAct=Date.now();const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el.dataset,el,e);});
document.addEventListener("input",e=>{const bd=e.target.dataset;if(bd&&bd.b!==undefined&&S.board&&S.board.blocks[+bd.b]){S.board.blocks[+bd.b][bd.f]=e.target.value;S.board.synced=false;save();schedulePush();return;}if(e.target.id==="askQ"){cur.q=e.target.value;const r=$("#askRes");if(r)r.innerHTML=askResults();}});
document.addEventListener("change",e=>{if(e.target.id==="nm2"){S.name=e.target.value.trim().slice(0,30);save();toast("Nome salvo");}});
document.addEventListener("touchstart",()=>{lastAct=Date.now();},{passive:true});
$("#imp").addEventListener("change",async e=>{
 const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
 try{const o=JSON.parse(await f.text());if(!o||typeof o!=="object"||!o.items||!o.settings)throw new Error("inválido");
  if(!confirm("Substituir o progresso atual por esta cópia?"))return;S=merge(o);Q=null;save();applyTheme();go("home");toast("Progresso restaurado");}
 catch(err){toast("Este arquivo não é uma cópia válida do DriverEnglish");}
});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---------- Tempo de estudo ---------- */
const ACTIVE=new Set(["session","game","listen","category","phrases","myrun","shrun","mono","sos"]);let tick=0;
setInterval(()=>{if(document.visibilityState==="visible"&&ACTIVE.has(cur.s)&&Date.now()-lastAct<120000){const d=todayStr();S.days[d]=(S.days[d]||0)+1;if(++tick%10===0)save();}},1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){save();if(TTS)speechSynthesis.cancel();}});

/* ---------- Início ---------- */
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(cur.s==="settings"){const y=window.scrollY;render();window.scrollTo(0,y);}};}
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
applyTheme();
window.addEventListener("hashchange",()=>{if(location.hash==="#texto"||location.hash.startsWith("#tela=")||document.body.classList.contains("textmode"))location.reload();});
const TEXT_MODE=location.hash==="#texto";
if(TEXT_MODE){
 document.body.classList.add("textmode");
 document.title="DriverEnglish · Texto";
 $("#view").innerHTML=`<div class="tx-head">${LOGO}<b>Minhas respostas</b><button class="btn" data-act="txTheme">Claro / Escuro</button><a href="./">Voltar ao app</a></div>`+MY.map((m,i)=>`<section><div class="tx-q">${i+1}. ${esc(m.q)}</div>${m.s.map(x=>`<div class="tx-s"><div class="tx-en">${esc(x[0])}</div><div class="tx-pt">${esc(x[1])}</div></div>`).join("")}</section>`).join("");
}
const TELA_ID=(location.hash.match(/^#tela=([a-z0-9]{24,64})$/)||[])[1]||null;
if(TELA_ID){
 document.body.classList.add("textmode");document.title="DriverEnglish · Tela";
 $("#view").innerHTML=`<div class="tx-head">${LOGO}<b>DriverEnglish</b><span id="tstat" class="bstat">A carregar…</span><button class="btn" data-act="txTheme">Claro / Escuro</button></div><div id="tbody" style="margin-top:12px"></div>`;
 const ck="driverenglish.tela."+TELA_ID;let last="";
 const draw=bl=>{$("#tbody").innerHTML=bl.length?bl.map(x=>`<section class="tx-blk">${x.en?`<div class="tx-en">${esc(x.en)}</div>`:""}${x.pt?`<div class="tx-pt">${esc(x.pt)}</div>`:""}</section>`).join(""):`<p class="tx-pt" style="margin-top:40px">Ainda não há texto. No iPhone, abra Praticar › Tela do Tesla e escreva.</p>`;};
 const st=(t,c)=>{const e=$("#tstat");if(e){e.textContent=t;e.className="bstat "+c;}};
 try{const c=localStorage.getItem(ck);if(c)draw(JSON.parse(c));}catch(e){}
 const poll=async()=>{if(document.visibilityState!=="visible")return;
  try{const r=await fetch(fbUrl(TELA_ID),{cache:"no-store"});
   if(r.status===404){draw([]);st("● Ao vivo","ok");return;}
   if(!r.ok)throw new Error("HTTP "+r.status);
   const j=await r.json(),u=((j.fields||{}).updated||{}).timestampValue||"";
   if(u!==last){last=u;const bl=parseBoard(j);draw(bl);try{localStorage.setItem(ck,JSON.stringify(bl));}catch(e){}}
   st("● Ao vivo","ok");
  }catch(e){st("Sem ligação, a tentar de novo…","bad");}};
 poll();setInterval(poll,5000);document.addEventListener("visibilitychange",poll);
}
if(!TEXT_MODE&&!TELA_ID)render();
if(!TEXT_MODE&&!TELA_ID&&!S.onboarded){$("#modal").innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="obt">${LOGO}<h2 id="obt" style="margin-top:14px">Bem-vindo ao DriverEnglish</h2><p class="lbl" style="font-size:15px">Inglês para o dia a dia com passageiros, em 10 minutos por dia. Sem conta e sem pressão.</p><label class="lbl" for="nm" style="display:block;margin-top:16px">Como você quer ser chamado?</label><input id="nm" type="text" maxlength="30" autocomplete="given-name" placeholder="Seu nome"><div class="safe">${ic("car",22)}<span>Pratique sempre com o carro parado.</span></div><button class="btn pri wide mt" data-act="onboard">Começar</button></div></div>`;}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
